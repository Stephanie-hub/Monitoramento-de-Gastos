<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>🎬 Roleta da Val - Capas de Filmes</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --rosa-bebê: #FFB6D9;
            --rosa-chiclete: #FF69B4;
            --lilás: #DA70D6;
            --lavanda: #E6B5F0;
            --rosa-escuro: #FF1493;
            --roxo-escuro: #9932CC;
        }

        body {
            font-family: 'Fredoka', 'Poppins', sans-serif;
            background: linear-gradient(135deg, #FFB6D9 0%, #E6B5F0 25%, #DA70D6 50%, #E6B5F0 75%, #FFB6D9 100%);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            color: #333;
            -webkit-tap-highlight-color: transparent;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) translateX(0px); }
            50% { transform: translateY(-20px) translateX(10px); }
        }

        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 30px rgba(255, 105, 180, 0.5); }
            50% { box-shadow: 0 0 60px rgba(255, 105, 180, 0.9); }
        }

        @keyframes sparkle {
            0% { transform: scale(0) rotate(0deg); opacity: 1; }
            100% { transform: scale(1.5) rotate(360deg); opacity: 0; }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(50px) scale(0.8); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .stars-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .star {
            position: absolute;
            width: 3px;
            height: 3px;
            background: white;
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
            animation: twinkle 3s infinite;
        }

        .container {
            position: relative;
            z-index: 10;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .header {
            margin-top: 30px;
            margin-bottom: 25px;
            animation: float 6s ease-in-out infinite;
        }

        .title {
            font-size: clamp(2rem, 8vw, 4rem);
            font-weight: 800;
            background: linear-gradient(135deg, #FF1493, #DA70D6, #FF69B4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px rgba(255, 105, 180, 0.3);
        }

        .subtitle {
            font-size: clamp(1rem, 3vw, 1.2rem);
            color: #9932CC;
            font-weight: 500;
            margin-top: 10px;
            font-style: italic;
        }

        .roulette-wrapper {
            position: relative;
            width: clamp(280px, 85vw, 500px);
            height: clamp(280px, 85vw, 500px);
            margin: 10px auto;
        }

        .roulette-container {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            box-shadow: 
                0 0 60px rgba(255, 105, 180, 0.5),
                0 20px 60px rgba(218, 112, 214, 0.3),
                inset 0 0 40px rgba(255, 255, 255, 0.2);
            border: 8px solid white;
            animation: pulse-glow 3s ease-in-out infinite;
            overflow: hidden;
            background: #f0f0f0;
        }

        .roulette {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            transition: transform 4s cubic-bezier(0.13, 0.65, 0.08, 0.99);
        }

        .slice {
            position: absolute;
            width: 50%;
            height: 50%;
            top: 50%;
            left: 50%;
            transform-origin: 0% 0%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: default;
            transition: filter 0.3s;
        }

        .slice-content {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 10px;
        }

        .slice-icon {
            font-size: clamp(1.5rem, 4vw, 2.8rem);
            margin-bottom: 2px;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
        }

        .slice-label {
            color: white;
            font-size: clamp(0.45rem, 1.2vw, 0.75rem);
            font-weight: 700;
            text-shadow: 1px 1px 4px rgba(0,0,0,0.6);
            text-align: center;
            line-height: 1.1;
            padding: 0 8px;
            word-break: break-word;
            max-width: 80%;
            background: rgba(0,0,0,0.2);
            padding: 2px 8px;
            border-radius: 10px;
            backdrop-filter: blur(2px);
        }

        .pointer-wrapper {
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 15;
            filter: drop-shadow(0 4px 12px rgba(255, 20, 147, 0.6));
        }

        .pointer {
            width: 0;
            height: 0;
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-top: 38px solid #FF1493;
            filter: drop-shadow(0 0 20px rgba(255, 20, 147, 0.8));
            animation: pulse-glow 1.5s ease-in-out infinite;
        }

        .spin-button {
            margin-top: 30px;
            padding: 18px 50px;
            font-size: clamp(1rem, 2.5vw, 1.3rem);
            font-weight: 700;
            border: none;
            border-radius: 50px;
            background: linear-gradient(135deg, #FF1493, #DA70D6);
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 40px rgba(255, 105, 180, 0.5);
            letter-spacing: 2px;
            font-family: 'Fredoka', sans-serif;
            text-transform: uppercase;
            border: 3px solid rgba(255, 255, 255, 0.3);
            touch-action: manipulation;
            position: relative;
            overflow: hidden;
        }

        .spin-button::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.2), transparent);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .spin-button:hover::before {
            opacity: 1;
        }

        .spin-button:active {
            transform: scale(0.95);
        }

        .spin-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .result-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
            backdrop-filter: blur(8px);
        }

        .result-overlay.active {
            display: flex;
        }

        .result-card {
            background: linear-gradient(135deg, rgba(255, 182, 217, 0.95), rgba(230, 181, 240, 0.95));
            backdrop-filter: blur(20px);
            border: 3px solid rgba(255, 255, 255, 0.4);
            border-radius: 30px;
            padding: 40px;
            text-align: center;
            max-width: 90%;
            width: 420px;
            box-shadow: 0 0 80px rgba(255, 105, 180, 0.4);
            animation: slideUp 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
        }

        .result-card .result-icon {
            font-size: 4rem;
            margin-bottom: 10px;
        }

        .result-card .movie-name {
            font-size: clamp(1.8rem, 5vw, 2.8rem);
            font-weight: 800;
            background: linear-gradient(135deg, #FF1493, #DA70D6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 15px 0;
        }

        .result-card p {
            color: #555;
            font-size: 1rem;
            margin-top: 10px;
        }

        .close-result {
            position: absolute;
            top: 15px;
            right: 20px;
            background: none;
            border: none;
            font-size: 2rem;
            cursor: pointer;
            color: #FF1493;
            transition: transform 0.3s;
            touch-action: manipulation;
        }

        .close-result:active {
            transform: rotate(90deg) scale(1.2);
        }

        .manage-movies-section {
            position: relative;
            z-index: 11;
            margin: 30px 0 20px;
            max-width: 600px;
            width: 100%;
        }

        .manage-card {
            background: linear-gradient(135deg, rgba(255, 182, 217, 0.92), rgba(230, 181, 240, 0.92));
            backdrop-filter: blur(20px);
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 25px;
            padding: 25px;
            box-shadow: 0 0 40px rgba(255, 105, 180, 0.3);
        }

        .manage-card h3 {
            font-size: 1.2rem;
            color: #9932CC;
            margin-bottom: 15px;
        }

        .textarea-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 15px;
        }

        .movie-textarea {
            width: 100%;
            height: 140px;
            padding: 15px;
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 15px;
            background: rgba(255, 255, 255, 0.9);
            font-family: 'Fredoka', sans-serif;
            font-size: 1rem;
            color: #333;
            outline: none;
            resize: vertical;
            line-height: 1.6;
            touch-action: auto;
        }

        .movie-textarea:focus {
            background: rgba(255, 255, 255, 0.98);
            border-color: #FF69B4;
            box-shadow: 0 0 20px rgba(255, 105, 180, 0.3);
        }

        .process-list-btn {
            padding: 14px 30px;
            background: linear-gradient(135deg, #FF1493, #DA70D6);
            color: white;
            border: none;
            border-radius: 15px;
            font-weight: 600;
            cursor: pointer;
            font-family: 'Fredoka', sans-serif;
            font-size: 1.1rem;
            box-shadow: 0 0 20px rgba(255, 105, 180, 0.4);
            letter-spacing: 1px;
            touch-action: manipulation;
            transition: transform 0.2s;
        }

        .process-list-btn:active {
            transform: scale(0.95);
        }

        .movies-list-container {
            max-height: 250px;
            overflow-y: auto;
            margin-bottom: 15px;
            padding: 12px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            -webkit-overflow-scrolling: touch;
        }

        .movies-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .movie-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 14px;
            background: rgba(255, 255, 255, 0.7);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .movie-item-text {
            flex: 1;
            color: #333;
            font-weight: 500;
            word-break: break-word;
        }

        .delete-movie-btn {
            background: linear-gradient(135deg, #FF1493, #FF69B4);
            color: white;
            border: none;
            border-radius: 50%;
            width: 26px;
            height: 26px;
            cursor: pointer;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-left: 10px;
            flex-shrink: 0;
            touch-action: manipulation;
            transition: transform 0.2s;
        }

        .delete-movie-btn:active {
            transform: scale(0.9) rotate(90deg);
        }

        .empty-message {
            text-align: center;
            color: rgba(153, 50, 204, 0.5);
            padding: 20px;
            font-style: italic;
        }

        .manage-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .clear-all-btn, .toggle-manage-btn {
            flex: 1;
            min-width: 120px;
            padding: 12px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            font-family: 'Fredoka', sans-serif;
            font-size: 0.9rem;
            touch-action: manipulation;
            transition: transform 0.2s;
            border: 2px solid rgba(255, 105, 180, 0.3);
        }

        .clear-all-btn:active, .toggle-manage-btn:active {
            transform: scale(0.95);
        }

        .clear-all-btn {
            background: rgba(255, 105, 180, 0.1);
            color: #9932CC;
        }

        .toggle-manage-btn {
            background: rgba(255, 105, 180, 0.15);
            color: #9932CC;
        }

        .manage-movies-section.collapsed .input-group,
        .manage-movies-section.collapsed .movies-list-container {
            display: none;
        }

        @media (max-width: 768px) {
            .roulette-wrapper {
                width: clamp(220px, 75vw, 350px);
                height: clamp(220px, 75vw, 350px);
            }

            .result-card {
                padding: 30px 20px;
            }

            .manage-card {
                padding: 18px;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 10px;
            }

            .title {
                font-size: 1.8rem;
            }

            .spin-button {
                padding: 14px 30px;
                font-size: 0.9rem;
            }

            .result-card {
                border-radius: 20px;
                padding: 25px 15px;
            }
        }
    </style>
</head>
<body>

    <div class="stars-container" id="starsContainer"></div>

    <div class="container">
        
        <div class="header">
            <h1 class="title">🎬 Roleta da Val</h1>
            <p class="subtitle">Gire e descubra qual filme assistir hoje!</p>
        </div>

        <div class="manage-movies-section" id="manageMoviesSection">
            <div class="manage-card">
                <h3>📋 Adicione seus Filmes</h3>
                
                <div class="textarea-group">
                    <textarea 
                        id="movieTextarea" 
                        placeholder="Cole sua lista aqui:&#10;&#10;🎬 Meninas Malvadas&#10;🎬 A Culpa é das Estrelas&#10;🎬 Clueless&#10;&#10;(Um filme por linha)"
                        class="movie-textarea"
                        autocorrect="off"
                        autocapitalize="off"
                        spellcheck="false"
                    ></textarea>
                    <button id="processListBtn" class="process-list-btn">✨ Organizar Lista ✨</button>
                </div>

                <div class="movies-list-container">
                    <div id="moviesList" class="movies-list"></div>
                </div>

                <div class="manage-actions">
                    <button id="clearAllBtn" class="clear-all-btn">🗑️ Limpar</button>
                    <button id="toggleManage" class="toggle-manage-btn">▼ Fechar</button>
                </div>
            </div>
        </div>

        <div class="roulette-wrapper">
            <div class="pointer-wrapper">
                <div class="pointer"></div>
            </div>
            <div class="roulette-container">
                <div class="roulette" id="roulette"></div>
            </div>
        </div>

        <button class="spin-button" id="spinButton">🎲 GIRAR</button>
    </div>

    <div class="result-overlay" id="resultOverlay">
        <div class="result-card">
            <button class="close-result" id="closeResult">&times;</button>
            <div class="result-icon" id="resultIcon">🎬</div>
            <p>Hoje vocês vão assistir:</p>
            <div class="movie-name" id="movieName">🎬</div>
            <p>✨ Boa sessão! ✨</p>
        </div>
    </div>

    <script>
        // =============================================
        // CONFIGURAÇÕES
        // =============================================

        const STORAGE_KEY = 'roleta-filmes-val';
        const MAX_FILMES = 12;

        // Emojis e cores para cada filme
        const EMOJIS = ['🎬', '🎭', '🎪', '🎨', '🎯', '🎮', '🎵', '🎶', '🎼', '🎹', '🎺', '🎻', '🥁', '🎸', '🎷', '🎤', '🎧', '🎼', '🎭', '🎪'];
        const CORES = [
            '#FF1493', '#FF69B4', '#DA70D6', '#E6B5F0', 
            '#FFB6D9', '#FF1493', '#FF69B4', '#DA70D6',
            '#E6B5F0', '#FFB6D9', '#FF1493', '#FF69B4'
        ];

        // =============================================
        // ELEMENTOS
        // =============================================

        const roulette = document.getElementById('roulette');
        const spinButton = document.getElementById('spinButton');
        const resultOverlay = document.getElementById('resultOverlay');
        const movieName = document.getElementById('movieName');
        const resultIcon = document.getElementById('resultIcon');
        const closeResult = document.getElementById('closeResult');
        const starsContainer = document.getElementById('starsContainer');
        const movieTextarea = document.getElementById('movieTextarea');
        const processListBtn = document.getElementById('processListBtn');
        const moviesList = document.getElementById('moviesList');
        const clearAllBtn = document.getElementById('clearAllBtn');
        const toggleManageBtn = document.getElementById('toggleManage');
        const manageMoviesSection = document.getElementById('manageMoviesSection');

        let filmes = [];
        let isSpinning = false;
        let currentRotation = 0;

        // =============================================
        // LOCALSTORAGE
        // =============================================

        function saveFilmes() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(filmes));
        }

        function loadFilmes() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                filmes = JSON.parse(saved);
            } else {
                filmes = [
                    "Meninas Malvadas",
                    "A Culpa é das Estrelas",
                    "Clueless",
                    "10 Coisas que Odeio em Você",
                    "Bridget Jones",
                    "O Diário da Princesa",
                    "Legally Blonde",
                    "As Patricinhas de Beverly Hills"
                ];
                saveFilmes();
            }
        }

        // =============================================
        // EMOJIS PARA FILMES
        // =============================================

        function getEmojiForMovie(index) {
            return EMOJIS[index % EMOJIS.length];
        }

        function getColorForMovie(index) {
            return CORES[index % CORES.length];
        }

        // =============================================
        // GERENCIAR FILMES
        // =============================================

        function processMovieList(text) {
            const lines = text.split('\n')
                .map(line => line.replace(/^[🎬🎭🎪🎨🎯🎮🎵🎶🎼🎹🎺🎻🥁🎸🎷🎤🎧]\s*/, '').trim())
                .filter(line => line.length > 0);
            
            if (lines.length === 0) {
                alert('Por favor, cole uma lista com pelo menos um filme.');
                return;
            }

            let addedCount = 0;
            let skippedCount = 0;
            const existingMovies = new Set(filmes);
            
            for (const movie of lines) {
                if (!existingMovies.has(movie)) {
                    if (filmes.length >= MAX_FILMES) {
                        skippedCount++;
                        continue;
                    }
                    filmes.push(movie);
                    existingMovies.add(movie);
                    addedCount++;
                } else {
                    skippedCount++;
                }
            }

            if (addedCount === 0 && skippedCount > 0) {
                alert('Todos os filmes já estão na roleta!');
                return;
            }

            let message = `✨ ${addedCount} filme(s) adicionado(s)!`;
            if (skippedCount > 0) {
                message += `\n\n${skippedCount} ignorado(s) (já existentes ou limite de ${MAX_FILMES}).`;
            }
            alert(message);

            saveFilmes();
            updateMoviesList();
            updateRoulette();
            movieTextarea.value = '';
            createSparkles(20);
        }

        function removeFilme(index) {
            filmes.splice(index, 1);
            saveFilmes();
            updateMoviesList();
            updateRoulette();
        }

        function updateMoviesList() {
            moviesList.innerHTML = '';

            if (filmes.length === 0) {
                const emptyMsg = document.createElement('div');
                emptyMsg.className = 'empty-message';
                emptyMsg.textContent = '✨ Adicione filmes para começar!';
                moviesList.appendChild(emptyMsg);
                return;
            }

            filmes.forEach((filme, index) => {
                const movieItem = document.createElement('div');
                movieItem.className = 'movie-item';

                const textSpan = document.createElement('span');
                textSpan.className = 'movie-item-text';
                textSpan.textContent = `${getEmojiForMovie(index)} ${filme}`;

                const deleteBtn = document.createElement('button');
                deleteBtn.className = 'delete-movie-btn';
                deleteBtn.textContent = '✕';
                deleteBtn.addEventListener('click', () => removeFilme(index));

                movieItem.appendChild(textSpan);
                movieItem.appendChild(deleteBtn);
                moviesList.appendChild(movieItem);
            });
        }

        function clearAllMovies() {
            if (filmes.length === 0) return;
            
            if (confirm('Tem certeza que deseja limpar todos os filmes?')) {
                filmes = [];
                saveFilmes();
                updateMoviesList();
                updateRoulette();
                createSparkles(10);
            }
        }

        // =============================================
        // ROLETA COM CAPAS
        // =============================================

        function updateRoulette() {
            if (filmes.length === 0) {
                spinButton.disabled = true;
                spinButton.textContent = '❌ Adicione filmes!';
                roulette.innerHTML = '';
                return;
            }

            spinButton.disabled = false;
            spinButton.textContent = '🎲 GIRAR';
            criarRoleta();
        }

        function criarRoleta() {
            roulette.innerHTML = '';
            const total = filmes.length;
            const angle = 360 / total;
            
            filmes.forEach((filme, index) => {
                const slice = document.createElement('div');
                slice.className = 'slice';
                
                const startAngle = index * angle;
                const midAngle = startAngle + (angle / 2);
                const cor = getColorForMovie(index);
                const emoji = getEmojiForMovie(index);
                
                // Configura o slice
                slice.style.transform = `rotate(${startAngle}deg)`;
                slice.style.clipPath = `polygon(0% 0%, 100% 0%, 100% 100%, 0% 100%)`;
                slice.style.background = `linear-gradient(135deg, ${cor}, ${cor}dd)`;
                slice.style.border = '1px solid rgba(255,255,255,0.2)';
                
                // Conteúdo
                const content = document.createElement('div');
                content.className = 'slice-content';
                
                const icon = document.createElement('div');
                icon.className = 'slice-icon';
                icon.textContent = emoji;
                
                const label = document.createElement('div');
                label.className = 'slice-label';
                label.textContent = filme.length > 15 ? filme.substring(0, 14) + '…' : filme;
                
                // Posiciona o conteúdo
                const contentRotation = midAngle - 90;
                content.style.transform = `rotate(${contentRotation}deg)`;
                content.style.transformOrigin = 'center center';
                
                content.appendChild(icon);
                content.appendChild(label);
                slice.appendChild(content);
                roulette.appendChild(slice);
            });
        }

        // =============================================
        // GIRAR ROLETA
        // =============================================

        function spinRoulette() {
            if (isSpinning || filmes.length === 0) return;

            isSpinning = true;
            spinButton.disabled = true;
            playClickSound();

            const total = filmes.length;
            const angle = 360 / total;
            const randomIndex = Math.floor(Math.random() * total);
            
            const targetAngle = randomIndex * angle + (angle / 2);
            const fullRotations = 5 + Math.floor(Math.random() * 3);
            const targetRotation = fullRotations * 360 + (360 - targetAngle);
            
            roulette.style.transition = 'transform 4s cubic-bezier(0.13, 0.65, 0.08, 0.99)';
            roulette.style.transform = `rotate(${targetRotation}deg)`;
            
            currentRotation = targetRotation;

            setTimeout(() => {
                const selectedMovie = filmes[randomIndex];
                const selectedEmoji = getEmojiForMovie(randomIndex);
                showResult(selectedMovie, selectedEmoji);
                createConfetti();
                createSparkles(40);
                
                isSpinning = false;
                spinButton.disabled = false;
            }, 4200);
        }

        // =============================================
        // RESULTADO
        // =============================================

        function showResult(movie, emoji) {
            resultIcon.textContent = emoji;
            movieName.textContent = movie;
            resultOverlay.classList.add('active');
            playWinSound();
        }

        closeResult.addEventListener('click', () => {
            resultOverlay.classList.remove('active');
        });

        resultOverlay.addEventListener('click', (e) => {
            if (e.target === resultOverlay) {
                resultOverlay.classList.remove('active');
            }
        });

        // =============================================
        // EFEITOS VISUAIS
        // =============================================

        function createConfetti() {
            const emojis = ['✨', '💖', '⭐', '💫', '🎉', '🌟', '🎊', '💕'];
            for (let i = 0; i < 35; i++) {
                const confetti = document.createElement('div');
                confetti.textContent = emojis[Math.floor(Math.random() * emojis.length)];
                confetti.style.cssText = `
                    position: fixed;
                    left: ${Math.random() * window.innerWidth}px;
                    top: -20px;
                    font-size: ${Math.random() * 20 + 15}px;
                    opacity: 1;
                    pointer-events: none;
                    z-index: 101;
                    transition: all 3.5s ease-out;
                `;
                
                document.body.appendChild(confetti);

                setTimeout(() => {
                    const xOffset = (Math.random() - 0.5) * 200;
                    confetti.style.top = window.innerHeight + 20 + 'px';
                    confetti.style.left = (parseFloat(confetti.style.left) + xOffset) + 'px';
                    confetti.style.opacity = '0';
                    confetti.style.transform = `rotate(${Math.random() * 720}deg) scale(${0.5 + Math.random()})`;
                }, 50);

                setTimeout(() => confetti.remove(), 4000);
            }
        }

        function createSparkles(count = 30) {
            for (let i = 0; i < count; i++) {
                const sparkle = document.createElement('div');
                sparkle.textContent = '✨';
                sparkle.style.cssText = `
                    position: fixed;
                    left: ${Math.random() * window.innerWidth}px;
                    top: ${Math.random() * window.innerHeight}px;
                    font-size: ${Math.random() * 15 + 10}px;
                    opacity: 1;
                    pointer-events: none;
                    z-index: 99;
                    transition: all 0.8s ease-out;
                `;
                
                document.body.appendChild(sparkle);

                setTimeout(() => {
                    sparkle.style.opacity = '0';
                    sparkle.style.transform = `scale(2) rotate(180deg)`;
                }, 50);

                setTimeout(() => sparkle.remove(), 900);
            }
        }

        // =============================================
        // SONS
        // =============================================

        function playClickSound() {
            try {
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();

                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);

                oscillator.frequency.value = 800;
                oscillator.type = 'sine';

                gainNode.gain.setValueAtTime(0.1, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.1);

                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + 0.1);
            } catch(e) {}
        }

        function playWinSound() {
            try {
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const notes = [523, 659, 784];

                notes.forEach((freq, index) => {
                    const oscillator = audioContext.createOscillator();
                    const gainNode = audioContext.createGain();

                    oscillator.connect(gainNode);
                    gainNode.connect(audioContext.destination);

                    oscillator.frequency.value = freq;
                    oscillator.type = 'sine';

                    const startTime = audioContext.currentTime + index * 0.1;
                    gainNode.gain.setValueAtTime(0.1, startTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, startTime + 0.3);

                    oscillator.start(startTime);
                    oscillator.stop(startTime + 0.3);
                });
            } catch(e) {}
        }

        // =============================================
        // FUNDO ANIMADO
        // =============================================

        function createStars() {
            for (let i = 0; i < 50; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.animationDelay = Math.random() * 3 + 's';
                starsContainer.appendChild(star);
            }

            for (let i = 0; i < 20; i++) {
                const sparkle = document.createElement('div');
                sparkle.className = 'star';
                sparkle.style.width = '5px';
                sparkle.style.height = '5px';
                sparkle.style.left = Math.random() * 100 + '%';
                sparkle.style.top = Math.random() * 100 + '%';
                sparkle.style.background = '#FFB6D9';
                sparkle.style.animationDelay = Math.random() * 2 + 's';
                starsContainer.appendChild(sparkle);
            }
        }

        // =============================================
        // EVENT LISTENERS
        // =============================================

        processListBtn.addEventListener('click', () => {
            processMovieList(movieTextarea.value);
        });

        movieTextarea.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && e.ctrlKey) {
                e.preventDefault();
                processMovieList(movieTextarea.value);
            }
        });

        clearAllBtn.addEventListener('click', clearAllMovies);

        toggleManageBtn.addEventListener('click', () => {
            manageMoviesSection.classList.toggle('collapsed');
            toggleManageBtn.textContent = manageMoviesSection.classList.contains('collapsed') 
                ? '▲ Abrir' 
                : '▼ Fechar';
        });

        spinButton.addEventListener('click', spinRoulette);

        // =============================================
        // INICIALIZAÇÃO
        // =============================================

        window.addEventListener('load', () => {
            loadFilmes();
            updateMoviesList();
            updateRoulette();
            createStars();
        });

        // Sparkles aleatórios
        setInterval(() => {
            if (!isSpinning && Math.random() > 0.8) {
                createSparkles(3);
            }
        }, 3000);
    </script>

</body>
