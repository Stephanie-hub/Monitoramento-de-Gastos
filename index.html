<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>💰 WiseSpend · Monitor de Gastos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg-primary: #0a0e17;
            --bg-secondary: #111827;
            --bg-card: #1a2332;
            --bg-card-hover: #1f2b3f;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --accent-green: #10b981;
            --accent-green-glow: rgba(16, 185, 129, 0.2);
            --accent-red: #ef4444;
            --accent-red-glow: rgba(239, 68, 68, 0.2);
            --accent-blue: #3b82f6;
            --accent-purple: #8b5cf6;
            --accent-gold: #f59e0b;
            --border-color: rgba(255, 255, 255, 0.06);
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            --radius: 16px;
            --radius-sm: 10px;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 20px 16px 80px;
            background-image: 
                radial-gradient(ellipse at 20% 50%, rgba(59, 130, 246, 0.05) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 20%, rgba(139, 92, 246, 0.05) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 100%, rgba(16, 185, 129, 0.03) 0%, transparent 40%);
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-secondary); }
        ::-webkit-scrollbar-thumb { background: var(--text-muted); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-secondary); }

        /* Header */
        .header {
            max-width: 800px;
            margin: 0 auto 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-icon {
            width: 42px;
            height: 42px;
            background: linear-gradient(135deg, var(--accent-green), var(--accent-blue));
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            box-shadow: 0 4px 16px rgba(16, 185, 129, 0.3);
        }

        .logo h1 {
            font-size: 22px;
            font-weight: 800;
            background: linear-gradient(135deg, #f1f5f9 60%, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        .logo span {
            font-weight: 300;
            font-size: 14px;
            color: var(--text-secondary);
            -webkit-text-fill-color: var(--text-secondary);
        }

        .header-actions {
            display: flex;
            gap: 8px;
        }

        .btn-icon {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            width: 42px;
            height: 42px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 18px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-icon:hover {
            background: var(--bg-card-hover);
            color: var(--text-primary);
            transform: translateY(-2px);
        }

        /* Cards de resumo */
        .summary-grid {
            max-width: 800px;
            margin: 0 auto 20px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
        }

        .summary-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 16px 18px;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .summary-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            border-radius: var(--radius) var(--radius) 0 0;
        }

        .summary-card.income::before { background: var(--accent-green); }
        .summary-card.expense::before { background: var(--accent-red); }
        .summary-card.balance::before { background: linear-gradient(90deg, var(--accent-blue), var(--accent-purple)); }

        .summary-card .label {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .summary-card .value {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .summary-card .value.positive { color: var(--accent-green); }
        .summary-card .value.negative { color: var(--accent-red); }
        .summary-card .value.neutral { color: var(--text-primary); }

        .summary-card .sub {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        /* Form */
        .form-container {
            max-width: 800px;
            margin: 0 auto 16px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 20px;
            transition: all 0.3s;
        }

        .form-container.collapsed {
            padding: 12px 20px;
            cursor: pointer;
        }

        .form-container.collapsed .form-body {
            display: none;
        }

        .form-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            user-select: none;
        }

        .form-header h3 {
            font-size: 15px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-header .toggle-icon {
            font-size: 20px;
            transition: transform 0.3s;
            color: var(--text-muted);
        }

        .form-container.collapsed .toggle-icon {
            transform: rotate(180deg);
        }

        .form-body {
            margin-top: 16px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        .form-group label {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            letter-spacing: 0.3px;
            text-transform: uppercase;
        }

        .form-group input,
        .form-group select {
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            padding: 10px 14px;
            color: var(--text-primary);
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            transition: all 0.2s;
            outline: none;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }

        .form-group input::placeholder {
            color: var(--text-muted);
        }

        .form-group select option {
            background: var(--bg-secondary);
        }

        .btn-submit {
            grid-column: 1 / -1;
            padding: 12px;
            border: none;
            border-radius: var(--radius-sm);
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            color: white;
            font-weight: 700;
            font-size: 15px;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: all 0.2s;
            letter-spacing: 0.3px;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(59, 130, 246, 0.3);
        }

        .btn-submit:active {
            transform: scale(0.98);
        }

        /* Filtros */
        .filters {
            max-width: 800px;
            margin: 0 auto 16px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
        }

        .filter-btn {
            padding: 6px 16px;
            border: 1px solid var(--border-color);
            border-radius: 20px;
            background: transparent;
            color: var(--text-secondary);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Inter', sans-serif;
            letter-spacing: 0.3px;
        }

        .filter-btn:hover {
            background: var(--bg-card);
            color: var(--text-primary);
        }

        .filter-btn.active {
            background: var(--bg-card);
            border-color: var(--accent-blue);
            color: var(--accent-blue);
        }

        .filter-btn.clear {
            border-color: var(--accent-red);
            color: var(--accent-red);
        }

        .filter-btn.clear:hover {
            background: rgba(239, 68, 68, 0.1);
        }

        /* Lista de transações */
        .transactions {
            max-width: 800px;
            margin: 0 auto;
        }

        .transaction-item {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            padding: 14px 16px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 14px;
            transition: all 0.2s;
            animation: slideIn 0.3s ease;
        }

        .transaction-item:hover {
            background: var(--bg-card-hover);
            transform: translateX(4px);
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .transaction-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
        }

        .transaction-icon.income {
            background: rgba(16, 185, 129, 0.15);
            color: var(--accent-green);
        }

        .transaction-icon.expense {
            background: rgba(239, 68, 68, 0.15);
            color: var(--accent-red);
        }

        .transaction-info {
            flex: 1;
            min-width: 0;
        }

        .transaction-info .title {
            font-weight: 600;
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .transaction-info .meta {
            font-size: 12px;
            color: var(--text-muted);
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .transaction-info .meta .category {
            background: rgba(255, 255, 255, 0.05);
            padding: 0 8px;
            border-radius: 4px;
        }

        .transaction-amount {
            font-weight: 700;
            font-size: 16px;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .transaction-amount.positive {
            color: var(--accent-green);
        }

        .transaction-amount.negative {
            color: var(--accent-red);
        }

        .transaction-delete {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 16px;
            padding: 4px 8px;
            border-radius: 6px;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .transaction-delete:hover {
            color: var(--accent-red);
            background: rgba(239, 68, 68, 0.1);
        }

        /* Empty state */
        .empty-state {
            text-align: center;
            padding: 48px 20px;
            color: var(--text-muted);
        }

        .empty-state .emoji {
            font-size: 48px;
            margin-bottom: 12px;
            display: block;
        }

        .empty-state h3 {
            color: var(--text-secondary);
            font-weight: 600;
            margin-bottom: 4px;
        }

        .empty-state p {
            font-size: 14px;
        }

        /* Footer */
        .footer {
            max-width: 800px;
            margin: 24px auto 0;
            text-align: center;
            font-size: 12px;
            color: var(--text-muted);
            border-top: 1px solid var(--border-color);
            padding-top: 20px;
        }

        .footer .total-count {
            color: var(--text-secondary);
        }

        /* Responsive */
        @media (max-width: 600px) {
            .form-body {
                grid-template-columns: 1fr;
            }
            .form-group.full {
                grid-column: 1;
            }
            .btn-submit {
                grid-column: 1;
            }
            .summary-grid {
                grid-template-columns: 1fr 1fr;
            }
            .header {
                flex-direction: column;
                align-items: stretch;
                gap: 8px;
            }
            .header-actions {
                justify-content: flex-end;
            }
            .logo h1 {
                font-size: 18px;
            }
        }

        @media (max-width: 400px) {
            .summary-grid {
                grid-template-columns: 1fr;
            }
            .transaction-item {
                flex-wrap: wrap;
                gap: 8px;
            }
            .transaction-amount {
                font-size: 14px;
            }
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 12px 24px;
            border-radius: var(--radius-sm);
            font-size: 14px;
            font-weight: 500;
            color: var(--text-primary);
            box-shadow: var(--shadow);
            opacity: 0;
            transition: all 0.4s ease;
            z-index: 100;
            pointer-events: none;
            white-space: nowrap;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
            pointer-events: auto;
        }

        .toast.success { border-left: 4px solid var(--accent-green); }
        .toast.error { border-left: 4px solid var(--accent-red); }
    </style>
</head>
<body>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <!-- Header -->
    <header class="header">
        <div class="logo">
            <div class="logo-icon">💰</div>
            <div>
                <h1>WiseSpend</h1>
                <span>controle financeiro</span>
            </div>
        </div>
        <div class="header-actions">
            <button class="btn-icon" id="exportBtn" title="Exportar dados">📤</button>
            <button class="btn-icon" id="clearBtn" title="Limpar tudo">🗑️</button>
        </div>
    </header>

    <!-- Summary -->
    <div class="summary-grid" id="summaryGrid">
        <div class="summary-card income">
            <div class="label">💰 Receitas</div>
            <div class="value positive" id="totalIncome">R$ 0,00</div>
            <div class="sub" id="incomeCount">0 transações</div>
        </div>
        <div class="summary-card expense">
            <div class="label">📤 Despesas</div>
            <div class="value negative" id="totalExpense">R$ 0,00</div>
            <div class="sub" id="expenseCount">0 transações</div>
        </div>
        <div class="summary-card balance">
            <div class="label">⚖️ Saldo</div>
            <div class="value neutral" id="totalBalance">R$ 0,00</div>
            <div class="sub" id="balanceStatus">💰 Em dia</div>
        </div>
    </div>

    <!-- Form -->
    <div class="form-container" id="formContainer">
        <div class="form-header" id="formToggle">
            <h3>✏️ Nova transação</h3>
            <span class="toggle-icon">▼</span>
        </div>
        <div class="form-body">
            <div class="form-group">
                <label>Descrição</label>
                <input type="text" id="descInput" placeholder="Ex: Salário, Aluguel..." maxlength="50">
            </div>
            <div class="form-group">
                <label>Valor (R$)</label>
                <input type="number" id="amountInput" placeholder="0,00" step="0.01" min="0.01">
            </div>
            <div class="form-group">
                <label>Tipo</label>
                <select id="typeSelect">
                    <option value="income">💰 Receita</option>
                    <option value="expense">📤 Despesa</option>
                </select>
            </div>
            <div class="form-group">
                <label>Categoria</label>
                <select id="categorySelect">
                    <option value="Alimentação">🍽️ Alimentação</option>
                    <option value="Transporte">🚗 Transporte</option>
                    <option value="Moradia">🏠 Moradia</option>
                    <option value="Saúde">💊 Saúde</option>
                    <option value="Educação">📚 Educação</option>
                    <option value="Lazer">🎮 Lazer</option>
                    <option value="Salário">💼 Salário</option>
                    <option value="Investimento">📈 Investimento</option>
                    <option value="Outros">📌 Outros</option>
                </select>
            </div>
            <div class="form-group full">
                <label>Data</label>
                <input type="date" id="dateInput">
            </div>
            <button class="btn-submit" id="submitBtn">➕ Adicionar transação</button>
        </div>
    </div>

    <!-- Filters -->
    <div class="filters" id="filterContainer">
        <button class="filter-btn active" data-filter="all">📋 Todas</button>
        <button class="filter-btn" data-filter="income">💰 Receitas</button>
        <button class="filter-btn" data-filter="expense">📤 Despesas</button>
        <button class="filter-btn clear" id="clearFiltersBtn">✖️ Limpar filtros</button>
    </div>

    <!-- Transactions List -->
    <div class="transactions" id="transactionsList">
        <!-- Renderizado via JS -->
    </div>

    <!-- Footer -->
    <footer class="footer">
        <span class="total-count" id="totalCount">0 transações</span>
        <span style="margin: 0 8px;">·</span>
        <span>💾 dados salvos localmente</span>
    </footer>

    <script>
        // ============================================
        // WISESPEND - App completo
        // ============================================

        const STORAGE_KEY = 'wisespend_transactions';

        // Estado
        let transactions = [];
        let currentFilter = 'all';
        let editingId = null;

        // Elementos
        const els = {
            summaryGrid: document.getElementById('summaryGrid'),
            totalIncome: document.getElementById('totalIncome'),
            totalExpense: document.getElementById('totalExpense'),
            totalBalance: document.getElementById('totalBalance'),
            balanceStatus: document.getElementById('balanceStatus'),
            incomeCount: document.getElementById('incomeCount'),
            expenseCount: document.getElementById('expenseCount'),
            totalCount: document.getElementById('totalCount'),
            transactionsList: document.getElementById('transactionsList'),
            descInput: document.getElementById('descInput'),
            amountInput: document.getElementById('amountInput'),
            typeSelect: document.getElementById('typeSelect'),
            categorySelect: document.getElementById('categorySelect'),
            dateInput: document.getElementById('dateInput'),
            submitBtn: document.getElementById('submitBtn'),
            formToggle: document.getElementById('formToggle'),
            formContainer: document.getElementById('formContainer'),
            clearFiltersBtn: document.getElementById('clearFiltersBtn'),
            exportBtn: document.getElementById('exportBtn'),
            clearBtn: document.getElementById('clearBtn'),
            toast: document.getElementById('toast'),
        };

        // ========== FUNÇÕES ==========

        function loadData() {
            try {
                const data = localStorage.getItem(STORAGE_KEY);
                if (data) {
                    transactions = JSON.parse(data);
                    // Garantir que datas sejam strings
                    transactions = transactions.map(t => ({
                        ...t,
                        date: t.date || new Date().toISOString().split('T')[0]
                    }));
                } else {
                    // Dados iniciais de exemplo
                    transactions = [
                        { id: Date.now() - 100000, desc: 'Salário', amount: 5000, type: 'income', category: 'Salário',
                            date: getToday() },
                        { id: Date.now() - 80000, desc: 'Aluguel', amount: 1500, type: 'expense', category: 'Moradia',
                            date: getToday() },
                        { id: Date.now() - 60000, desc: 'Supermercado', amount: 600, type: 'expense',
                            category: 'Alimentação', date: getToday() },
                        { id: Date.now() - 40000, desc: 'Uber', amount: 80, type: 'expense', category: 'Transporte',
                            date: getToday() },
                    ];
                    saveData();
                }
            } catch (e) {
                transactions = [];
                saveData();
            }
        }

        function saveData() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(transactions));
        }

        function getToday() {
            return new Date().toISOString().split('T')[0];
        }

        function formatCurrency(value) {
            return new Intl.NumberFormat('pt-BR', {
                style: 'currency',
                currency: 'BRL',
                minimumFractionDigits: 2
            }).format(value);
        }

        function generateId() {
            return Date.now() + Math.random() * 1000;
        }

        function getCategoryEmoji(cat) {
            const map = {
                'Alimentação': '🍽️',
                'Transporte': '🚗',
                'Moradia': '🏠',
                'Saúde': '💊',
                'Educação': '📚',
                'Lazer': '🎮',
                'Salário': '💼',
                'Investimento': '📈',
                'Outros': '📌'
            };
            return map[cat] || '📌';
        }

        // ========== RENDER ==========

        function renderSummary() {
            const totalIncome = transactions.filter(t => t.type === 'income').reduce((s, t) => s + t.amount, 0);
            const totalExpense = transactions.filter(t => t.type === 'expense').reduce((s, t) => s + t.amount, 0);
            const balance = totalIncome - totalExpense;
            const incomeCount = transactions.filter(t => t.type === 'income').length;
            const expenseCount = transactions.filter(t => t.type === 'expense').length;

            els.totalIncome.textContent = formatCurrency(totalIncome);
            els.totalExpense.textContent = formatCurrency(totalExpense);
            els.totalBalance.textContent = formatCurrency(balance);
            els.incomeCount.textContent = `${incomeCount} transações`;
            els.expenseCount.textContent = `${expenseCount} transações`;

            const balanceEl = els.totalBalance;
            balanceEl.className = 'value';
            if (balance > 0) {
                balanceEl.classList.add('positive');
                els.balanceStatus.textContent = '💰 Saldo positivo!';
                els.balanceStatus.style.color = 'var(--accent-green)';
            } else if (balance < 0) {
                balanceEl.classList.add('negative');
                els.balanceStatus.textContent = '⚠️ Saldo negativo!';
                els.balanceStatus.style.color = 'var(--accent-red)';
            } else {
                balanceEl.classList.add('neutral');
                els.balanceStatus.textContent = '⚖️ Saldo zero';
                els.balanceStatus.style.color = 'var(--text-secondary)';
            }

            els.totalCount.textContent = `${transactions.length} transações`;
        }

        function renderTransactions() {
            let filtered = [...transactions];

            if (currentFilter !== 'all') {
                filtered = filtered.filter(t => t.type === currentFilter);
            }

            // Ordenar por data (mais recente primeiro)
            filtered.sort((a, b) => new Date(b.date) - new Date(a.date));

            if (filtered.length === 0) {
                els.transactionsList.innerHTML = `
                    <div class="empty-state">
                        <span class="emoji">📭</span>
                        <h3>Nenhuma transação encontrada</h3>
                        <p>Adicione sua primeira transação ou ajuste os filtros.</p>
                    </div>
                `;
                return;
            }

            els.transactionsList.innerHTML = filtered.map(t => {
                const emoji = getCategoryEmoji(t.category);
                const iconClass = t.type === 'income' ? 'income' : 'expense';
                const amountClass = t.type === 'income' ? 'positive' : 'negative';
                const sign = t.type === 'income' ? '+' : '-';
                const dateFormatted = new Date(t.date + 'T00:00:00').toLocaleDateString('pt-BR');

                return `
                    <div class="transaction-item" data-id="${t.id}">
                        <div class="transaction-icon ${iconClass}">${emoji}</div>
                        <div class="transaction-info">
                            <div class="title">${escapeHtml(t.desc)}</div>
                            <div class="meta">
                                <span>📅 ${dateFormatted}</span>
                                <span class="category">${t.category}</span>
                            </div>
                        </div>
                        <div class="transaction-amount ${amountClass}">${sign} ${formatCurrency(t.amount)}</div>
                        <button class="transaction-delete" data-id="${t.id}" title="Excluir">✕</button>
                    </div>
                `;
            }).join('');

            // Eventos de delete
            document.querySelectorAll('.transaction-delete').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const id = Number(btn.dataset.id);
                    deleteTransaction(id);
                });
            });

            // Evento de clique para editar
            document.querySelectorAll('.transaction-item').forEach(item => {
                item.addEventListener('click', () => {
                    const id = Number(item.dataset.id);
                    editTransaction(id);
                });
            });
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function renderAll() {
            renderSummary();
            renderTransactions();
            updateFilterButtons();
        }

        // ========== CRUD ==========

        function addTransaction() {
            const desc = els.descInput.value.trim();
            const amount = parseFloat(els.amountInput.value);
            const type = els.typeSelect.value;
            const category = els.categorySelect.value;
            const date = els.dateInput.value || getToday();

            if (!desc) {
                showToast('Por favor, digite uma descrição.', 'error');
                return;
            }

            if (!amount || amount <= 0) {
                showToast('Por favor, digite um valor válido.', 'error');
                return;
            }

            const transaction = {
                id: generateId(),
                desc,
                amount,
                type,
                category,
                date
            };

            if (editingId) {
                // Editando
                const idx = transactions.findIndex(t => t.id === editingId);
                if (idx > -1) {
                    transactions[idx] = { ...transaction, id: editingId };
                    editingId = null;
                    els.submitBtn.textContent = '➕ Adicionar transação';
                    showToast('✅ Transação atualizada!', 'success');
                }
            } else {
                transactions.push(transaction);
                showToast('✅ Transação adicionada!', 'success');
            }

            saveData();
            clearForm();
            renderAll();
            // Fecha o form em mobile
            if (window.innerWidth < 600) {
                els.formContainer.classList.add('collapsed');
            }
        }

        function deleteTransaction(id) {
            if (!confirm('Tem certeza que deseja excluir esta transação?')) return;
            transactions = transactions.filter(t => t.id !== id);
            saveData();
            renderAll();
            showToast('🗑️ Transação removida!', 'success');
        }

        function editTransaction(id) {
            const t = transactions.find(t => t.id === id);
            if (!t) return;

            editingId = id;
            els.descInput.value = t.desc;
            els.amountInput.value = t.amount;
            els.typeSelect.value = t.type;
            els.categorySelect.value = t.category;
            els.dateInput.value = t.date;
            els.submitBtn.textContent = '✏️ Atualizar transação';

            // Abrir o form
            els.formContainer.classList.remove('collapsed');
            els.descInput.focus();

            // Scroll suave
            els.formContainer.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        function clearForm() {
            els.descInput.value = '';
            els.amountInput.value = '';
            els.typeSelect.value = 'income';
            els.categorySelect.value = 'Alimentação';
            els.dateInput.value = getToday();
            editingId = null;
            els.submitBtn.textContent = '➕ Adicionar transação';
        }

        // ========== FILTROS ==========

        function setFilter(filter) {
            currentFilter = filter;
            renderAll();
        }

        function updateFilterButtons() {
            document.querySelectorAll('.filter-btn[data-filter]').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.filter === currentFilter);
            });
        }

        // ========== TOAST ==========

        let toastTimeout = null;

        function showToast(message, type = 'success') {
            const toast = els.toast;
            toast.textContent = message;
            toast.className = `toast ${type}`;
            toast.classList.add('show');

            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        // ========== EXPORT ==========

        function exportData() {
            if (transactions.length === 0) {
                showToast('Nenhuma transação para exportar.', 'error');
                return;
            }

            let csv = 'Data,Descrição,Categoria,Tipo,Valor\n';
            transactions.forEach(t => {
                const dateFormatted = new Date(t.date + 'T00:00:00').toLocaleDateString('pt-BR');
                const typeFormatted = t.type === 'income' ? 'Receita' : 'Despesa';
                const amountFormatted = t.amount.toFixed(2).replace('.', ',');
                csv +=
                    `${dateFormatted},"${t.desc}",${t.category},${typeFormatted},${amountFormatted}\n`;
            });

            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `wisespend_${getToday()}.csv`;
            link.click();
            URL.revokeObjectURL(link.href);
            showToast('📤 Dados exportados com sucesso!', 'success');
        }

        // ========== CLEAR ALL ==========

        function clearAll() {
            if (transactions.length === 0) {
                showToast('Nenhuma transação para limpar.', 'error');
                return;
            }
            if (!confirm('⚠️ Tem certeza que deseja apagar TODAS as transações? Esta ação é irreversível!')) return;
            transactions = [];
            saveData();
            renderAll();
            showToast('🗑️ Todos os dados foram removidos.', 'success');
        }

        // ========== EVENTOS ==========

        // Submit
        els.submitBtn.addEventListener('click', addTransaction);

        // Enter key
        els.descInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') els.amountInput.focus(); });
        els.amountInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') addTransaction(); });

        // Form toggle
        els.formToggle.addEventListener('click', () => {
            els.formContainer.classList.toggle('collapsed');
            if (!els.formContainer.classList.contains('collapsed') && editingId) {
                els.descInput.focus();
            }
        });

        // Filters
        document.querySelectorAll('.filter-btn[data-filter]').forEach(btn => {
            btn.addEventListener('click', () => {
                setFilter(btn.dataset.filter);
            });
        });

        els.clearFiltersBtn.addEventListener('click', () => {
            setFilter('all');
        });

        // Export
        els.exportBtn.addEventListener('click', exportData);

        // Clear all
        els.clearBtn.addEventListener('click', clearAll);

        // ========== INIT ==========

        function init() {
            loadData();

            // Set default date
            els.dateInput.value = getToday();

            renderAll();

            // Se houver poucos dados, abrir o form
            if (transactions.length <= 2) {
                els.formContainer.classList.remove('collapsed');
            }

            console.log('💰 WiseSpend carregado!');
            console.log(`📊 ${transactions.length} transações`);
        }

        init();

        // Keyboard shortcut: Ctrl+Enter para adicionar
        document.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                addTransaction();
            }
        });
    </script>
</body>
</html>
