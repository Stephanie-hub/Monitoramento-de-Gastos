<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>✨ Roleta da Val ✨</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Poppins:wght@400;500;600;700;800&family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --rosa-bebê: #FFB6D9;
            --rosa-chiclete: #FF69B4;
            --lilás: #DA70D6;
            --lavanda: #E6B5F0;
            --branco: #FFFFFF;
            --prata: #E8D5F2;
            --rosa-escuro: #FF1493;
            --roxo-escuro: #9932CC;
        }

        body {
            font-family: 'Fredoka', 'Poppins', sans-serif;
            background: linear-gradient(135deg, #FFB6D9 0%, #E6B5F0 25%, #DA70D6 50%, #E6B5F0 75%, #FFB6D9 100%);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            color: #333;
            -webkit-tap-highlight-color: transparent;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) translateX(0px); }
            50% { transform: translateY(-20px) translateX(10px); }
        }

        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 20px rgba(255, 182, 217, 0.5); }
            50% { box-shadow: 0 0 40px rgba(255, 105, 180, 0.8); }
        }

        @keyframes sparkle {
            0% { transform: scale(0) rotate(0deg); opacity: 1; }
            100% { transform: scale(1) rotate(360deg); opacity: 0; }
        }

        @keyframes heart-float {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-100vh) rotate(360deg); opacity: 0; }
        }

        @keyframes butterfly-float {
            0%, 100% { transform: translateX(0) translateY(0) rotate(0deg); }
            25% { transform: translateX(30px) translateY(-30px) rotate(10deg); }
            50% { transform: translateX(0) translateY(-60px) rotate(0deg); }
            75% { transform: translateX(-30px) translateY(-30px) rotate(-10deg); }
        }

        .stars-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .star {
            position: absolute;
            width: 3px;
            height: 3px;
            background: white;
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
            animation: twinkle 3s infinite;
        }

        .sparkle-bg {
            position: absolute;
            width: 6px;
            height: 6px;
            background: radial-gradient(circle, #FFB6D9, transparent);
            border-radius: 50%;
            animation: twinkle 2s infinite;
        }

        .heart-bg {
            position: absolute;
            font-size: 14px;
            opacity: 0.2;
            animation: heart-float 15s linear infinite;
            pointer-events: none;
        }

        .butterfly-bg {
            position: absolute;
            font-size: 16px;
            opacity: 0.15;
            animation: butterfly-float 8s ease-in-out infinite;
            pointer-events: none;
        }

        .container {
            position: relative;
            z-index: 10;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
        }

        .header {
            margin-top: 40px;
            margin-bottom: 30px;
            animation: float 6s ease-in-out infinite;
        }

        .title {
            font-size: clamp(2rem, 8vw, 4.5rem);
            font-weight: 800;
            background: linear-gradient(135deg, #FF1493, #DA70D6, #FF69B4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 0;
            letter-spacing: 2px;
            text-shadow: 0 0 30px rgba(255, 105, 180, 0.3);
            filter: drop-shadow(0 0 20px rgba(255, 182, 217, 0.4));
        }

        .subtitle {
            font-size: clamp(1rem, 4vw, 1.3rem);
            color: #9932CC;
            font-weight: 500;
            margin-top: 15px;
            font-style: italic;
            text-shadow: 0 0 15px rgba(230, 181, 240, 0.4);
            letter-spacing: 1px;
        }

        .roulette-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 40px;
            margin-bottom: 60px;
        }

        .roulette-wrapper {
            position: relative;
            width: clamp(250px, 80vw, 450px);
            height: clamp(250px, 80vw, 450px);
        }

        .roulette-container {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            box-shadow: 
                0 0 60px rgba(255, 105, 180, 0.6),
                0 20px 60px rgba(218, 112, 214, 0.4),
                inset 0 0 30px rgba(255, 255, 255, 0.3);
            border: 6px solid #FFF;
            animation: pulse-glow 3s ease-in-out infinite;
            overflow: hidden;
            background: #FFF;
        }

        .roulette {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            transition: transform 4s cubic-bezier(0.17, 0.67, 0.12, 0.99);
        }

        .slice {
            position: absolute;
            width: 50%;
            height: 50%;
            top: 50%;
            left: 50%;
            transform-origin: 0% 0%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(0.6rem, 1.5vw, 0.9rem);
            font-weight: 600;
            color: white;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.3);
            padding: 5px;
            text-align: center;
            word-break: break-word;
            line-height: 1.2;
        }

        .slice-text {
            transform: rotate(0deg);
            width: 80%;
            text-align: center;
        }

        .pointer-wrapper {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 15;
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.2));
        }

        .pointer {
            width: 0;
            height: 0;
            border-left: 18px solid transparent;
            border-right: 18px solid transparent;
            border-top: 35px solid #FF1493;
            filter: drop-shadow(0 0 15px rgba(255, 20, 147, 0.8));
            animation: pulse-glow 2s ease-in-out infinite;
        }

        .spin-button {
            padding: 20px 50px;
            font-size: clamp(1rem, 3vw, 1.4rem);
            font-weight: 700;
            border: none;
            border-radius: 50px;
            background: linear-gradient(135deg, #FF69B4, #DA70D6);
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 
                0 0 30px rgba(255, 105, 180, 0.6),
                0 8px 25px rgba(218, 112, 214, 0.4);
            letter-spacing: 2px;
            font-family: 'Fredoka', sans-serif;
            position: relative;
            overflow: hidden;
            text-transform: uppercase;
            border: 2px solid rgba(255, 255, 255, 0.3);
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        .spin-button:active {
            transform: scale(0.95);
        }

        .spin-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: scale(0.98);
        }

        .result-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
            backdrop-filter: blur(5px);
        }

        .result-overlay.active {
            display: flex;
        }

        .result-card {
            background: linear-gradient(135deg, rgba(255, 182, 217, 0.95), rgba(230, 181, 240, 0.95));
            backdrop-filter: blur(20px);
            border: 3px solid rgba(255, 255, 255, 0.4);
            border-radius: 30px;
            padding: 40px;
            text-align: center;
            max-width: 90%;
            width: 400px;
            box-shadow: 0 0 60px rgba(255, 105, 180, 0.6);
            animation: slideUp 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(50px) scale(0.8);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .result-card h2 {
            font-size: 1.2rem;
            color: #9932CC;
            margin-bottom: 20px;
            letter-spacing: 2px;
        }

        .result-card .movie-name {
            font-size: clamp(1.5rem, 5vw, 2.5rem);
            font-weight: 800;
            background: linear-gradient(135deg, #FF1493, #DA70D6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 20px 0;
            word-break: break-word;
        }

        .result-card p {
            font-size: 1rem;
            color: #666;
            margin-top: 20px;
            line-height: 1.6;
        }

        .close-result {
            position: absolute;
            top: 15px;
            right: 20px;
            background: none;
            border: none;
            font-size: 2rem;
            cursor: pointer;
            color: #FF1493;
            transition: transform 0.2s ease;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        .close-result:hover {
            transform: rotate(90deg) scale(1.2);
        }

        .manage-movies-section {
            position: relative;
            z-index: 11;
            margin-bottom: 40px;
            max-width: 600px;
            width: 100%;
        }

        .manage-card {
            background: linear-gradient(135deg, rgba(255, 182, 217, 0.9), rgba(230, 181, 240, 0.9));
            backdrop-filter: blur(20px);
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 25px;
            padding: 25px;
            box-shadow: 0 0 40px rgba(255, 105, 180, 0.5);
        }

        .manage-card h3 {
            font-size: 1.3rem;
            color: #9932CC;
            margin-bottom: 20px;
            letter-spacing: 1px;
            font-weight: 600;
        }

        .textarea-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 20px;
        }

        .movie-textarea {
            width: 100%;
            height: 150px;
            padding: 15px;
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 15px;
            background: rgba(255, 255, 255, 0.9);
            font-family: 'Fredoka', sans-serif;
            font-size: 1rem;
            color: #333;
            transition: all 0.3s ease;
            outline: none;
            resize: vertical;
            min-height: 120px;
            line-height: 1.6;
            -webkit-user-select: text;
            user-select: text;
            -webkit-touch-callout: default;
            touch-action: auto;
        }

        .movie-textarea:focus {
            background: rgba(255, 255, 255, 0.98);
            border-color: #FF69B4;
            box-shadow: 0 0 20px rgba(255, 105, 180, 0.4);
        }

        .process-list-btn {
            padding: 15px 30px;
            background: linear-gradient(135deg, #FF1493, #DA70D6);
            color: white;
            border: none;
            border-radius: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Fredoka', sans-serif;
            font-size: 1.1rem;
            box-shadow: 0 0 20px rgba(255, 105, 180, 0.5);
            letter-spacing: 1px;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        .process-list-btn:active {
            transform: scale(0.95);
        }

        .movies-list-container {
            max-height: 300px;
            overflow-y: auto;
            margin-bottom: 20px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            -webkit-overflow-scrolling: touch;
        }

        .movies-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .movie-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 15px;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .movie-item-text {
            flex: 1;
            color: #333;
            font-weight: 500;
            word-break: break-word;
        }

        .delete-movie-btn {
            background: linear-gradient(135deg, #FF1493, #FF69B4);
            color: white;
            border: none;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            cursor: pointer;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            flex-shrink: 0;
            margin-left: 10px;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        .delete-movie-btn:active {
            transform: scale(0.9);
        }

        .empty-message {
            text-align: center;
            color: rgba(153, 50, 204, 0.6);
            padding: 20px;
            font-size: 0.95rem;
            font-style: italic;
        }

        .manage-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .clear-all-btn, .toggle-manage-btn {
            flex: 1;
            min-width: 140px;
            padding: 12px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Fredoka', sans-serif;
            font-size: 0.95rem;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        .clear-all-btn {
            background: linear-gradient(135deg, rgba(255, 105, 180, 0.15), rgba(218, 112, 214, 0.15));
            border: 2px solid rgba(255, 105, 180, 0.3);
            color: #9932CC;
        }

        .clear-all-btn:active {
            transform: scale(0.95);
        }

        .toggle-manage-btn {
            background: linear-gradient(135deg, rgba(255, 105, 180, 0.2), rgba(218, 112, 214, 0.2));
            border: 2px solid rgba(255, 105, 180, 0.3);
            color: #9932CC;
        }

        .toggle-manage-btn:active {
            transform: scale(0.95);
        }

        .manage-movies-section.collapsed .input-group,
        .manage-movies-section.collapsed .movies-list-container {
            display: none;
        }

        @media (max-width: 768px) {
            .roulette-wrapper {
                width: clamp(200px, 70vw, 350px);
                height: clamp(200px, 70vw, 350px);
            }

            .result-card {
                width: calc(100vw - 40px);
                padding: 30px 20px;
            }

            .manage-card {
                padding: 15px;
            }

            .movie-textarea {
                height: 120px;
                min-height: 100px;
                font-size: 0.95rem;
                padding: 12px;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 10px;
            }

            .title {
                font-size: 1.8rem;
            }

            .spin-button {
                padding: 15px 35px;
                font-size: 1rem;
            }

            .result-card {
                border-radius: 20px;
                padding: 25px 15px;
            }

            .process-list-btn {
                padding: 12px 20px;
                font-size: 1rem;
            }

            .manage-actions {
                flex-direction: column;
            }

            .clear-all-btn,
            .toggle-manage-btn {
                min-width: 100%;
                padding: 14px;
            }
        }
    </style>
</head>
<body>

    <div class="stars-container" id="starsContainer"></div>

    <div class="container">
        
        <div class="header">
            <h1 class="title">✨ Roleta da Val ✨</h1>
            <p class="subtitle">Escolhe o destino… e deixa a sorte decidir o próximo filme.</p>
        </div>

        <div class="manage-movies-section" id="manageMoviesSection">
            <div class="manage-card">
                <h3>🎬 Cole sua Lista de Filmes</h3>
                
                <div class="textarea-group">
                    <textarea 
                        id="movieTextarea" 
                        placeholder="Cole sua lista aqui:&#10;&#10;Meninas Malvadas&#10;A Culpa é das Estrelas&#10;Clueless&#10;&#10;(Um filme por linha)"
                        class="movie-textarea"
                        autocorrect="off"
                        autocapitalize="off"
                        spellcheck="false"
                        autocomplete="off"
                    ></textarea>
                    <button id="processListBtn" class="process-list-btn">✨ Organizar Lista ✨</button>
                </div>

                <div class="movies-list-container">
                    <div id="moviesList" class="movies-list"></div>
                </div>

                <div class="manage-actions">
                    <button id="clearAllBtn" class="clear-all-btn">🗑️ Limpar Tudo</button>
                    <button id="toggleManage" class="toggle-manage-btn">▼ Fechar</button>
                </div>
            </div>
        </div>

        <div class="roulette-section">
            <div class="roulette-wrapper">
                <div class="pointer-wrapper">
                    <div class="pointer"></div>
                </div>
                <div class="roulette-container">
                    <div class="roulette" id="roulette"></div>
                </div>
            </div>

            <div class="button-container">
                <button class="spin-button" id="spinButton">✨ GIRAR ✨</button>
            </div>
        </div>
    </div>

    <div class="result-overlay" id="resultOverlay">
        <div class="result-card">
            <button class="close-result" id="closeResult">&times;</button>
            <h2>✨✨✨</h2>
            <p>Hoje vocês vão assistir:</p>
            <div class="movie-name" id="movieName">🎬</div>
            <p>✨✨✨</p>
        </div>
    </div>

    <script>
        // =============================================
        // VARIÁVEIS GLOBAIS
        // =============================================

        const roulette = document.getElementById('roulette');
        const spinButton = document.getElementById('spinButton');
        const resultOverlay = document.getElementById('resultOverlay');
        const movieName = document.getElementById('movieName');
        const closeResult = document.getElementById('closeResult');
        const starsContainer = document.getElementById('starsContainer');
        const movieTextarea = document.getElementById('movieTextarea');
        const processListBtn = document.getElementById('processListBtn');
        const moviesList = document.getElementById('moviesList');
        const clearAllBtn = document.getElementById('clearAllBtn');
        const toggleManageBtn = document.getElementById('toggleManage');
        const manageMoviesSection = document.getElementById('manageMoviesSection');

        let filmes = [];
        let isSpinning = false;
        let currentRotation = 0;
        const STORAGE_KEY = 'roleta-filmes-val';

        // Cores para os slices
        const cores = [
            '#FF1493', '#FF69B4', '#DA70D6', '#E6B5F0',
            '#FFB6D9', '#FF1493', '#FF69B4', '#DA70D6',
            '#E6B5F0', '#FFB6D9', '#FF1493', '#FF69B4'
        ];

        // =============================================
        // LOCALSTORAGE
        // =============================================

        function saveFilmes() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(filmes));
        }

        function loadFilmes() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                filmes = JSON.parse(saved);
            } else {
                filmes = [
                    "Meninas Malvadas",
                    "A Culpa é das Estrelas",
                    "Clueless",
                    "10 Coisas que Odeio em Você",
                    "Bridget Jones",
                    "Confissões de um Adolescente",
                    "O Diário da Princesa",
                    "Legally Blonde"
                ];
                saveFilmes();
            }
        }

        // =============================================
        // GERENCIAR FILMES
        // =============================================

        function processMovieList(text) {
            const lines = text.split('\n')
                .map(line => line.trim())
                .filter(line => line.length > 0);
            
            if (lines.length === 0) {
                alert('Por favor, cole uma lista com pelo menos um filme.');
                return;
            }

            let addedCount = 0;
            let skippedCount = 0;
            const existingMovies = new Set(filmes);
            
            for (const movie of lines) {
                if (!existingMovies.has(movie)) {
                    if (filmes.length >= 12) {
                        skippedCount++;
                        continue;
                    }
                    filmes.push(movie);
                    existingMovies.add(movie);
                    addedCount++;
                } else {
                    skippedCount++;
                }
            }

            if (addedCount === 0 && skippedCount > 0) {
                alert('Todos os filmes da lista já estão na roleta!');
                return;
            }

            let message = `✨ ${addedCount} filme(s) adicionado(s) com sucesso!`;
            if (skippedCount > 0) {
                message += `\n\n${skippedCount} filme(s) foram ignorados (já existentes ou limite de 12).`;
            }
            alert(message);

            saveFilmes();
            updateMoviesList();
            updateRoulette();
            movieTextarea.value = '';
            createSparkles(15);
        }

        function removeFilme(index) {
            filmes.splice(index, 1);
            saveFilmes();
            updateMoviesList();
            updateRoulette();
        }

        function updateMoviesList() {
            moviesList.innerHTML = '';

            if (filmes.length === 0) {
                const emptyMsg = document.createElement('div');
                emptyMsg.className = 'empty-message';
                emptyMsg.textContent = '✨ Nenhum filme adicionado ainda.';
                moviesList.appendChild(emptyMsg);
                return;
            }

            filmes.forEach((filme, index) => {
                const movieItem = document.createElement('div');
                movieItem.className = 'movie-item';

                const textSpan = document.createElement('span');
                textSpan.className = 'movie-item-text';
                textSpan.textContent = `${index + 1}. ${filme}`;

                const deleteBtn = document.createElement('button');
                deleteBtn.className = 'delete-movie-btn';
                deleteBtn.textContent = '✕';
                deleteBtn.addEventListener('click', () => removeFilme(index));

                movieItem.appendChild(textSpan);
                movieItem.appendChild(deleteBtn);
                moviesList.appendChild(movieItem);
            });
        }

        function clearAllMovies() {
            if (filmes.length === 0) return;
            
            if (confirm('Tem certeza que deseja limpar todos os filmes?')) {
                filmes = [];
                saveFilmes();
                updateMoviesList();
                updateRoulette();
                createSparkles(10);
            }
        }

        // =============================================
        // ROLETA - CORRIGIDA
        // =============================================

        function updateRoulette() {
            if (filmes.length === 0) {
                spinButton.disabled = true;
                spinButton.textContent = '❌ Adicione filmes!';
                roulette.innerHTML = '';
                return;
            }

            spinButton.disabled = false;
            spinButton.textContent = '✨ GIRAR ✨';
            criarRoleta();
        }

        function criarRoleta() {
            roulette.innerHTML = '';
            const total = filmes.length;
            const angle = 360 / total;
            
            filmes.forEach((filme, index) => {
                const slice = document.createElement('div');
                slice.className = 'slice';
                
                // Calcula a posição e rotação
                const startAngle = index * angle;
                const endAngle = (index + 1) * angle;
                const midAngle = startAngle + (angle / 2);
                
                // Define a cor
                const cor = cores[index % cores.length];
                slice.style.background = `linear-gradient(135deg, ${cor}, ${cor}dd)`;
                
                // Posiciona o slice
                slice.style.transform = `rotate(${startAngle}deg)`;
                slice.style.clipPath = `polygon(0% 0%, 100% 0%, 100% 100%, 0% 100%)`;
                
                // Cria o texto dentro do slice
                const textSpan = document.createElement('span');
                textSpan.className = 'slice-text';
                textSpan.textContent = filme;
                
                // Rotaciona o texto para ficar legível
                const textRotation = midAngle;
                textSpan.style.transform = `rotate(${textRotation}deg)`;
                textSpan.style.position = 'absolute';
                textSpan.style.top = '50%';
                textSpan.style.left = '50%';
                textSpan.style.transformOrigin = '0% 0%';
                textSpan.style.transform = `rotate(${textRotation - 90}deg)`;
                textSpan.style.color = 'white';
                textSpan.style.textShadow = '1px 1px 3px rgba(0,0,0,0.5)';
                textSpan.style.fontWeight = '600';
                textSpan.style.fontSize = 'clamp(0.6rem, 1.5vw, 0.9rem)';
                textSpan.style.width = '45%';
                textSpan.style.textAlign = 'center';
                textSpan.style.position = 'absolute';
                textSpan.style.left = '50%';
                textSpan.style.top = '50%';
                textSpan.style.transform = `translate(-50%, -50%) rotate(${midAngle - 90}deg)`;
                
                slice.appendChild(textSpan);
                roulette.appendChild(slice);
            });
        }

        // =============================================
        // GIRAR ROLETA
        // =============================================

        function spinRoulette() {
            if (isSpinning || filmes.length === 0) return;

            isSpinning = true;
            spinButton.disabled = true;
            playClickSound();

            const total = filmes.length;
            const angle = 360 / total;
            const randomIndex = Math.floor(Math.random() * total);
            
            // Calcula o ângulo alvo
            const targetAngle = randomIndex * angle + (angle / 2);
            const fullRotations = 5 + Math.floor(Math.random() * 3);
            const targetRotation = fullRotations * 360 + (360 - targetAngle);
            
            // Aplica a rotação
            roulette.style.transition = 'transform 4s cubic-bezier(0.17, 0.67, 0.12, 0.99)';
            roulette.style.transform = `rotate(${targetRotation}deg)`;
            
            currentRotation = targetRotation;

            // Aguarda a animação terminar
            setTimeout(() => {
                const selectedMovie = filmes[randomIndex];
                showResult(selectedMovie);
                createConfetti();
                createSparkles(50);
                
                isSpinning = false;
                spinButton.disabled = false;
            }, 4200);
        }

        // =============================================
        // RESULTADO
        // =============================================

        function showResult(movie) {
            movieName.textContent = `🎬 ${movie}`;
            resultOverlay.classList.add('active');
            playWinSound();
        }

        closeResult.addEventListener('click', () => {
            resultOverlay.classList.remove('active');
        });

        resultOverlay.addEventListener('click', (e) => {
            if (e.target === resultOverlay) {
                resultOverlay.classList.remove('active');
            }
        });

        // =============================================
        // EFEITOS VISUAIS
        // =============================================

        function createConfetti() {
            const emojis = ['✨', '💖', '⭐', '💫', '🎉', '🌟'];
            for (let i = 0; i < 30; i++) {
                const confetti = document.createElement('div');
                confetti.textContent = emojis[Math.floor(Math.random() * emojis.length)];
                confetti.style.position = 'fixed';
                confetti.style.left = Math.random() * window.innerWidth + 'px';
                confetti.style.top = '-20px';
                confetti.style.fontSize = Math.random() * 20 + 15 + 'px';
                confetti.style.opacity = '1';
                confetti.style.pointerEvents = 'none';
                confetti.style.zIndex = '101';
                confetti.style.transition = 'all 3s ease-out';
                
                document.body.appendChild(confetti);

                setTimeout(() => {
                    confetti.style.top = window.innerHeight + 20 + 'px';
                    confetti.style.left = (parseFloat(confetti.style.left) + (Math.random() - 0.5) * 100) + 'px';
                    confetti.style.opacity = '0';
                    confetti.style.transform = `rotate(${Math.random() * 720}deg)`;
                }, 50);

                setTimeout(() => confetti.remove(), 3500);
            }
        }

        function createSparkles(count = 30) {
            for (let i = 0; i < count; i++) {
                const sparkle = document.createElement('div');
                sparkle.textContent = '✨';
                sparkle.style.position = 'fixed';
                sparkle.style.left = Math.random() * window.innerWidth + 'px';
                sparkle.style.top = Math.random() * window.innerHeight + 'px';
                sparkle.style.fontSize = Math.random() * 15 + 10 + 'px';
                sparkle.style.opacity = '1';
                sparkle.style.pointerEvents = 'none';
                sparkle.style.zIndex = '99';
                sparkle.style.transition = 'all 0.8s ease-out';
                
                document.body.appendChild(sparkle);

                setTimeout(() => {
                    sparkle.style.opacity = '0';
                    sparkle.style.transform = `scale(2) rotate(180deg)`;
                }, 50);

                setTimeout(() => sparkle.remove(), 900);
            }
        }

        // =============================================
        // SONS
        // =============================================

        function playClickSound() {
            try {
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();

                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);

                oscillator.frequency.value = 800;
                oscillator.type = 'sine';

                gainNode.gain.setValueAtTime(0.1, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.1);

                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + 0.1);
            } catch(e) {
                // Silencia erros de áudio
            }
        }

        function playWinSound() {
            try {
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const notes = [523, 659, 784];

                notes.forEach((freq, index) => {
                    const oscillator = audioContext.createOscillator();
                    const gainNode = audioContext.createGain();

                    oscillator.connect(gainNode);
                    gainNode.connect(audioContext.destination);

                    oscillator.frequency.value = freq;
                    oscillator.type = 'sine';

                    const startTime = audioContext.currentTime + index * 0.1;
                    gainNode.gain.setValueAtTime(0.1, startTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, startTime + 0.3);

                    oscillator.start(startTime);
                    oscillator.stop(startTime + 0.3);
                });
            } catch(e) {
                // Silencia erros de áudio
            }
        }

        // =============================================
        // FUNDO ANIMADO
        // =============================================

        function createStars() {
            for (let i = 0; i < 50; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.animationDelay = Math.random() * 3 + 's';
                starsContainer.appendChild(star);
            }

            for (let i = 0; i < 30; i++) {
                const sparkle = document.createElement('div');
                sparkle.className = 'sparkle-bg';
                sparkle.style.left = Math.random() * 100 + '%';
                sparkle.style.top = Math.random() * 100 + '%';
                sparkle.style.animationDelay = Math.random() * 2 + 's';
                starsContainer.appendChild(sparkle);
            }

            for (let i = 0; i < 8; i++) {
                const heart = document.createElement('div');
                heart.className = 'heart-bg';
                heart.textContent = '💖';
                heart.style.left = Math.random() * 100 + '%';
                heart.style.animationDelay = Math.random() * 15 + 's';
                starsContainer.appendChild(heart);
            }

            for (let i = 0; i < 5; i++) {
                const butterfly = document.createElement('div');
                butterfly.className = 'butterfly-bg';
                butterfly.textContent = '🦋';
                butterfly.style.left = Math.random() * 100 + '%';
                butterfly.style.top = Math.random() * 50 + '%';
                butterfly.style.animationDelay = Math.random() * 8 + 's';
                starsContainer.appendChild(butterfly);
            }
        }

        // =============================================
        // EVENT LISTENERS
        // =============================================

        processListBtn.addEventListener('click', () => {
            processMovieList(movieTextarea.value);
        });

        movieTextarea.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && e.ctrlKey) {
                e.preventDefault();
                processMovieList(movieTextarea.value);
            }
        });

        clearAllBtn.addEventListener('click', clearAllMovies);

        toggleManageBtn.addEventListener('click', () => {
            manageMoviesSection.classList.toggle('collapsed');
            toggleManageBtn.textContent = manageMoviesSection.classList.contains('collapsed') 
                ? '▲ Abrir' 
                : '▼ Fechar';
        });

        spinButton.addEventListener('click', spinRoulette);

        // =============================================
        // INICIALIZAÇÃO
        // =============================================

        window.addEventListener('load', () => {
            loadFilmes();
            updateMoviesList();
            updateRoulette();
            createStars();
        });

        // Sparkles aleatórios
        setInterval(() => {
            if (!isSpinning && Math.random() > 0.7) {
                createSparkles(3);
            }
        }, 3000);
    </script>

</body>
