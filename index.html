<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✨ Roleta da Val ✨</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Poppins:wght@400;500;600;700;800&family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* =============================================
           RESET E VARIÁVEIS GLOBAIS
           ============================================= */
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --rosa-bebê: #FFB6D9;
            --rosa-chiclete: #FF69B4;
            --lilás: #DA70D6;
            --lavanda: #E6B5F0;
            --branco: #FFFFFF;
            --prata: #E8D5F2;
            --rosa-escuro: #FF1493;
            --roxo-escuro: #9932CC;
        }

        body {
            font-family: 'Fredoka', 'Poppins', sans-serif;
            background: linear-gradient(135deg, #FFB6D9 0%, #E6B5F0 25%, #DA70D6 50%, #E6B5F0 75%, #FFB6D9 100%);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            color: #333;
        }

        /* =============================================
           ANIMAÇÕES GLOBAIS
           ============================================= */

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) translateX(0px); }
            50% { transform: translateY(-20px) translateX(10px); }
        }

        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 20px rgba(255, 182, 217, 0.5); }
            50% { box-shadow: 0 0 40px rgba(255, 105, 180, 0.8); }
        }

        @keyframes sparkle {
            0% { transform: scale(0) rotate(0deg); opacity: 1; }
            100% { transform: scale(1) rotate(360deg); opacity: 0; }
        }

        @keyframes heart-float {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-100vh) rotate(360deg); opacity: 0; }
        }

        @keyframes butterfly-float {
            0%, 100% { transform: translateX(0) translateY(0) rotate(0deg); }
            25% { transform: translateX(30px) translateY(-30px) rotate(10deg); }
            50% { transform: translateX(0) translateY(-60px) rotate(0deg); }
            75% { transform: translateX(-30px) translateY(-30px) rotate(-10deg); }
        }

        @keyframes confetti-fall {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(300px) rotate(720deg); opacity: 0; }
        }

        /* =============================================
           FUNDO ANIMADO - Partículas
           ============================================= */

        .stars-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .star {
            position: absolute;
            width: 3px;
            height: 3px;
            background: white;
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
            animation: twinkle 3s infinite;
        }

        .sparkle-bg {
            position: absolute;
            width: 6px;
            height: 6px;
            background: radial-gradient(circle, #FFB6D9, transparent);
            border-radius: 50%;
            animation: twinkle 2s infinite;
        }

        .heart-bg {
            position: absolute;
            font-size: 14px;
            opacity: 0.2;
            animation: heart-float 15s linear infinite;
            pointer-events: none;
        }

        .butterfly-bg {
            position: absolute;
            font-size: 16px;
            opacity: 0.15;
            animation: butterfly-float 8s ease-in-out infinite;
            pointer-events: none;
        }

        /* =============================================
           CONTAINER PRINCIPAL
           ============================================= */

        .container {
            position: relative;
            z-index: 10;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
        }

        /* =============================================
           CABEÇALHO
           ============================================= */

        .header {
            margin-top: 40px;
            margin-bottom: 30px;
            animation: float 6s ease-in-out infinite;
        }

        .title {
            font-size: clamp(2rem, 8vw, 4.5rem);
            font-weight: 800;
            background: linear-gradient(135deg, #FF1493, #DA70D6, #FF69B4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 0;
            letter-spacing: 2px;
            text-shadow: 0 0 30px rgba(255, 105, 180, 0.3);
            filter: drop-shadow(0 0 20px rgba(255, 182, 217, 0.4));
        }

        .subtitle {
            font-size: clamp(1rem, 4vw, 1.3rem);
            color: #9932CC;
            font-weight: 500;
            margin-top: 15px;
            font-style: italic;
            text-shadow: 0 0 15px rgba(230, 181, 240, 0.4);
            letter-spacing: 1px;
        }

        /* =============================================
           SEÇÃO DA ROLETA
           ============================================= */

        .roulette-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 40px;
            margin-bottom: 60px;
        }

        .roulette-wrapper {
            position: relative;
            width: clamp(200px, 80vw, 500px);
            height: clamp(200px, 80vw, 500px);
            perspective: 1000px;
        }

        .roulette-container {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            box-shadow: 
                0 0 60px rgba(255, 105, 180, 0.6),
                0 20px 60px rgba(218, 112, 214, 0.4),
                inset 0 0 30px rgba(255, 255, 255, 0.3);
            border: 8px solid;
            border-image: linear-gradient(135deg, #FFB6D9, #DA70D6, #E6B5F0, #FF69B4) 1;
            animation: pulse-glow 3s ease-in-out infinite;
            overflow: hidden;
        }

        .roulette {
            position: relative;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 30% 30%, rgba(255, 182, 217, 0.3), transparent),
                        radial-gradient(circle at 70% 70%, rgba(218, 112, 214, 0.2), transparent);
            border-radius: 50%;
            transition: transform 0s linear;
        }

        .slice {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(0.7rem, 2vw, 1rem);
            font-weight: 600;
            color: white;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.3);
            padding: 15px;
            text-align: center;
            word-break: break-word;
            clip-path: polygon(50% 0%, 100% 0%, 100% 100%, 50% 100%);
        }

        .slice:nth-child(1) { background: linear-gradient(135deg, #FF69B4, #FF1493); transform: rotate(0deg); }
        .slice:nth-child(2) { background: linear-gradient(135deg, #DA70D6, #FF69B4); transform: rotate(45deg); }
        .slice:nth-child(3) { background: linear-gradient(135deg, #E6B5F0, #DA70D6); transform: rotate(90deg); }
        .slice:nth-child(4) { background: linear-gradient(135deg, #FFB6D9, #E6B5F0); transform: rotate(135deg); }
        .slice:nth-child(5) { background: linear-gradient(135deg, #FF1493, #FF69B4); transform: rotate(180deg); }
        .slice:nth-child(6) { background: linear-gradient(135deg, #FF69B4, #DA70D6); transform: rotate(225deg); }
        .slice:nth-child(7) { background: linear-gradient(135deg, #DA70D6, #E6B5F0); transform: rotate(270deg); }
        .slice:nth-child(8) { background: linear-gradient(135deg, #E6B5F0, #FFB6D9); transform: rotate(315deg); }

        /* Pointer / Agulha */
        .pointer-wrapper {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 15;
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.2));
        }

        .pointer {
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 30px solid #FF1493;
            filter: drop-shadow(0 0 10px rgba(255, 20, 147, 0.8));
            animation: pulse-glow 2s ease-in-out infinite;
            transform-origin: bottom center;
        }

        /* =============================================
           BOTÃO GIRAR
           ============================================= */

        .button-container {
            position: relative;
            z-index: 20;
        }

        .spin-button {
            padding: 20px 50px;
            font-size: clamp(1rem, 3vw, 1.4rem);
            font-weight: 700;
            border: none;
            border-radius: 50px;
            background: linear-gradient(135deg, #FF69B4, #DA70D6);
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 
                0 0 30px rgba(255, 105, 180, 0.6),
                0 8px 25px rgba(218, 112, 214, 0.4);
            letter-spacing: 2px;
            font-family: 'Fredoka', sans-serif;
            position: relative;
            overflow: hidden;
            text-transform: uppercase;
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.3);
        }

        .spin-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.3), transparent);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .spin-button:hover {
            transform: scale(1.1) translateY(-3px);
            box-shadow: 
                0 0 50px rgba(255, 105, 180, 0.8),
                0 15px 40px rgba(218, 112, 214, 0.6);
            letter-spacing: 3px;
        }

        .spin-button:hover::before {
            opacity: 1;
        }

        .spin-button:active {
            transform: scale(0.98) translateY(-1px);
        }

        .spin-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* =============================================
           RESULTADO MODAL
           ============================================= */

        .result-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
            backdrop-filter: blur(5px);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .result-overlay.active {
            display: flex;
            opacity: 1;
        }

        .result-card {
            background: linear-gradient(135deg, rgba(255, 182, 217, 0.95), rgba(230, 181, 240, 0.95));
            backdrop-filter: blur(20px);
            border: 3px solid rgba(255, 255, 255, 0.4);
            border-radius: 30px;
            padding: 40px;
            text-align: center;
            max-width: 90%;
            width: 400px;
            box-shadow: 
                0 0 60px rgba(255, 105, 180, 0.6),
                0 20px 60px rgba(218, 112, 214, 0.4);
            animation: slideUp 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(50px) scale(0.8);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .result-card h2 {
            font-size: 1.2rem;
            color: #9932CC;
            margin-bottom: 20px;
            letter-spacing: 2px;
        }

        .result-card .movie-name {
            font-size: clamp(1.5rem, 5vw, 2.5rem);
            font-weight: 800;
            background: linear-gradient(135deg, #FF1493, #DA70D6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 20px 0;
            word-break: break-word;
        }

        .result-card p {
            font-size: 1rem;
            color: #666;
            margin-top: 20px;
            line-height: 1.6;
        }

        .close-result {
            position: absolute;
            top: 15px;
            right: 20px;
            background: none;
            border: none;
            font-size: 2rem;
            cursor: pointer;
            color: #FF1493;
            transition: transform 0.2s ease;
        }

        .close-result:hover {
            transform: rotate(90deg) scale(1.2);
        }

        /* =============================================
           SEÇÃO DE GERENCIAR FILMES
           ============================================= */

        .manage-movies-section {
            position: relative;
            z-index: 11;
            margin-bottom: 40px;
            max-width: 600px;
            width: 100%;
            animation: slideDown 0.5s ease;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .manage-card {
            background: linear-gradient(135deg, rgba(255, 182, 217, 0.9), rgba(230, 181, 240, 0.9));
            backdrop-filter: blur(20px);
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 25px;
            padding: 25px;
            box-shadow: 
                0 0 40px rgba(255, 105, 180, 0.5),
                0 10px 40px rgba(218, 112, 214, 0.3);
            transition: all 0.3s ease;
        }

        .manage-card h3 {
            font-size: 1.3rem;
            color: #9932CC;
            margin-bottom: 20px;
            letter-spacing: 1px;
            font-weight: 600;
        }

        .textarea-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 20px;
        }

        .movie-textarea {
            width: 100%;
            height: 150px;
            padding: 15px;
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 15px;
            background: rgba(255, 255, 255, 0.8);
            font-family: 'Fredoka', sans-serif;
            font-size: 1rem;
            color: #333;
            transition: all 0.3s ease;
            outline: none;
            resize: vertical;
            min-height: 120px;
            line-height: 1.6;
        }

        .movie-textarea:focus {
            background: rgba(255, 255, 255, 0.95);
            border-color: #FF69B4;
            box-shadow: 0 0 20px rgba(255, 105, 180, 0.4);
        }

        .movie-textarea::placeholder {
            color: rgba(153, 50, 204, 0.4);
        }

        .process-list-btn {
            padding: 15px 30px;
            background: linear-gradient(135deg, #FF1493, #DA70D6);
            color: white;
            border: none;
            border-radius: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Fredoka', sans-serif;
            font-size: 1.1rem;
            box-shadow: 
                0 0 20px rgba(255, 105, 180, 0.5),
                0 5px 15px rgba(218, 112, 214, 0.3);
            letter-spacing: 1px;
        }

        .process-list-btn:hover {
            transform: translateY(-3px);
            box-shadow: 
                0 0 30px rgba(255, 105, 180, 0.7),
                0 8px 20px rgba(218, 112, 214, 0.4);
        }

        .process-list-btn:active {
            transform: translateY(-1px);
        }

        .movies-list-container {
            max-height: 300px;
            overflow-y: auto;
            margin-bottom: 20px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .movies-list-container::-webkit-scrollbar {
            width: 8px;
        }

        .movies-list-container::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }

        .movies-list-container::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, #FF69B4, #DA70D6);
            border-radius: 10px;
        }

        .movies-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .movie-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 15px;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            animation: slideIn 0.3s ease;
            transition: all 0.2s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .movie-item:hover {
            background: rgba(255, 255, 255, 0.8);
            box-shadow: 0 0 15px rgba(255, 105, 180, 0.2);
            transform: translateX(5px);
        }

        .movie-item-text {
            flex: 1;
            color: #333;
            font-weight: 500;
            word-break: break-word;
        }

        .delete-movie-btn {
            background: linear-gradient(135deg, #FF1493, #FF69B4);
            color: white;
            border: none;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            cursor: pointer;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            flex-shrink: 0;
            margin-left: 10px;
        }

        .delete-movie-btn:hover {
            transform: scale(1.15) rotate(90deg);
            box-shadow: 0 0 15px rgba(255, 20, 147, 0.6);
        }

        .empty-message {
            text-align: center;
            color: rgba(153, 50, 204, 0.6);
            padding: 20px;
            font-size: 0.95rem;
            font-style: italic;
        }

        .manage-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .clear-all-btn {
            flex: 1;
            min-width: 140px;
            padding: 12px;
            background: linear-gradient(135deg, rgba(255, 105, 180, 0.15), rgba(218, 112, 214, 0.15));
            border: 2px solid rgba(255, 105, 180, 0.3);
            border-radius: 12px;
            color: #9932CC;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Fredoka', sans-serif;
            font-size: 0.95rem;
        }

        .clear-all-btn:hover {
            background: linear-gradient(135deg, rgba(255, 20, 147, 0.2), rgba(255, 105, 180, 0.2));
            border-color: #FF1493;
            transform: translateY(-2px);
        }

        .toggle-manage-btn {
            flex: 1;
            min-width: 140px;
            padding: 12px;
            background: linear-gradient(135deg, rgba(255, 105, 180, 0.2), rgba(218, 112, 214, 0.2));
            border: 2px solid rgba(255, 105, 180, 0.3);
            border-radius: 12px;
            color: #9932CC;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Fredoka', sans-serif;
            font-size: 0.95rem;
        }

        .toggle-manage-btn:hover {
            background: linear-gradient(135deg, rgba(255, 105, 180, 0.3), rgba(218, 112, 214, 0.3));
            transform: translateY(-2px);
        }

        .manage-movies-section.collapsed {
            margin-bottom: 20px;
        }

        .manage-movies-section.collapsed .manage-card {
            padding: 15px;
        }

        .manage-movies-section.collapsed .input-group,
        .manage-movies-section.collapsed .movies-list-container {
            display: none;
        }

        .manage-movies-section.collapsed h3 {
            margin-bottom: 0;
        }

        /* =============================================
           RESPONSIVIDADE
           ============================================= */

        @media (max-width: 768px) {
            .roulette-section {
                gap: 30px;
                margin-bottom: 40px;
            }

            .roulette-wrapper {
                width: clamp(180px, 70vw, 350px);
                height: clamp(180px, 70vw, 350px);
            }

            .result-card {
                width: calc(100vw - 40px);
                max-width: 100%;
                padding: 30px 20px;
            }

            .title {
                font-size: 2rem;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 10px;
            }

            .title {
                font-size: 1.8rem;
            }

            .subtitle {
                font-size: 0.95rem;
            }

            .spin-button {
                padding: 15px 35px;
                font-size: 1rem;
            }

            .result-card {
                border-radius: 20px;
                padding: 25px 15px;
            }

            .result-card .movie-name {
                font-size: 1.8rem;
            }
        }

        /* =============================================
           CURSOR PERSONALIZADO
           ============================================= */

        @supports (cursor: url('data:image/svg+xml')) {
            body {
                cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32"><polygon points="2,2 2,30 22,16" fill="%23FF69B4" stroke="%23DA70D6" stroke-width="1.5"/><circle cx="16" cy="16" r="4" fill="%23FFB6D9" opacity="0.6"/></svg>') 0 0, auto;
            }

            .spin-button {
                cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32"><circle cx="16" cy="16" r="14" fill="%23FF1493" stroke="%23DA70D6" stroke-width="2"/><polygon points="16,8 20,14 12,14" fill="%23FFB6D9"/></svg>') 16 16, pointer;
            }
        }
    </style>
</head>
<body>

    <!-- =============================================
         FUNDO ANIMADO - Camadas de partículas
         ============================================= -->
    <div class="stars-container" id="starsContainer"></div>

    <!-- =============================================
         CONTAINER PRINCIPAL
         ============================================= -->
    <div class="container">
        
        <!-- CABEÇALHO -->
        <div class="header">
            <h1 class="title">✨ Roleta da Val ✨</h1>
            <p class="subtitle">Escolhe o destino… e deixa a sorte decidir o próximo filme.</p>
        </div>

        <!-- SEÇÃO DE GERENCIAR FILMES -->
        <div class="manage-movies-section" id="manageMoviesSection">
            <div class="manage-card">
                <h3>🎬 Cole sua Lista de Filmes</h3>
                <div class="textarea-group">
                    <textarea 
                        id="movieTextarea" 
                        placeholder="Cole sua lista aqui:&#10;&#10;Meninas Malvadas&#10;A Culpa é das Estrelas&#10;Clueless&#10;&#10;(Um filme por linha)"
                        class="movie-textarea"
                    ></textarea>
                    <button id="processListBtn" class="process-list-btn">✨ Organizar Lista ✨</button>
                </div>

                <div class="movies-list-container">
                    <div id="moviesList" class="movies-list"></div>
                </div>

                <div class="manage-actions">
                    <button id="clearAllBtn" class="clear-all-btn">🗑️ Limpar Tudo</button>
                    <button id="toggleManage" class="toggle-manage-btn">▼ Fechar</button>
                </div>
            </div>
        </div>

        <!-- SEÇÃO DA ROLETA -->
        <div class="roulette-section">
            <div class="roulette-wrapper">
                <div class="pointer-wrapper">
                    <div class="pointer"></div>
                </div>
                <div class="roulette-container">
                    <div class="roulette" id="roulette"></div>
                </div>
            </div>

            <!-- BOTÃO GIRAR -->
            <div class="button-container">
                <button class="spin-button" id="spinButton">✨ GIRAR ✨</button>
            </div>
        </div>
    </div>

    <!-- =============================================
         MODAL DE RESULTADO
         ============================================= -->
    <div class="result-overlay" id="resultOverlay">
        <div class="result-card">
            <button class="close-result" id="closeResult">&times;</button>
            <h2>✨✨✨</h2>
            <p>Hoje vocês vão assistir:</p>
            <div class="movie-name" id="movieName">🎬</div>
            <p>✨✨✨</p>
        </div>
    </div>

    <!-- =============================================
         JAVASCRIPT - Lógica Principal
         ============================================= -->
    <script>
        /* =============================================
           VARIÁVEIS GLOBAIS
           ============================================= */

        const roulette = document.getElementById('roulette');
        const spinButton = document.getElementById('spinButton');
        const resultOverlay = document.getElementById('resultOverlay');
        const movieName = document.getElementById('movieName');
        const closeResult = document.getElementById('closeResult');
        const starsContainer = document.getElementById('starsContainer');
        const movieTextarea = document.getElementById('movieTextarea');
        const processListBtn = document.getElementById('processListBtn');
        const moviesList = document.getElementById('moviesList');
        const clearAllBtn = document.getElementById('clearAllBtn');
        const toggleManageBtn = document.getElementById('toggleManage');
        const manageMoviesSection = document.getElementById('manageMoviesSection');

        let filmes = [];
        let isSpinning = false;
        let currentRotation = 0;
        const STORAGE_KEY = 'roleta-filmes-val';

        /* =============================================
           LOCALSTORAGE - Salvar e Carregar Filmes
           ============================================= */

        function saveFilmes() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(filmes));
        }

        function loadFilmes() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                filmes = JSON.parse(saved);
            } else {
                // Filmes padrão na primeira vez
                filmes = [
                    "Meninas Malvadas",
                    "A Culpa é das Estrelas",
                    "Clueless",
                    "10 Coisas que Odeio em Você",
                    "Bridget Jones",
                    "Confissões de um Adolescente",
                    "O Diário da Princesa",
                    "Legally Blonde"
                ];
                saveFilmes();
            }
        }

        /* =============================================
           GERENCIAR FILMES - Adicionar, Remover, etc
           ============================================= */

        function processMovieList(text) {
            // Divide o texto por quebras de linha, remove espaços extras e linhas vazias
            const lines = text.split('\n')
                .map(line => line.trim())
                .filter(line => line.length > 0);
            
            if (lines.length === 0) {
                alert('Por favor, cole uma lista com pelo menos um filme.');
                return;
            }

            // Adiciona os filmes à lista, respeitando o limite máximo de 12
            let addedCount = 0;
            let skippedCount = 0;
            
            // Cria um Set para verificar duplicatas de forma eficiente
            const existingMovies = new Set(filmes);
            
            for (const movie of lines) {
                // Verifica se já existe e se ainda não atingiu o limite
                if (!existingMovies.has(movie)) {
                    if (filmes.length >= 12) {
                        skippedCount++;
                        continue;
                    }
                    filmes.push(movie);
                    existingMovies.add(movie);
                    addedCount++;
                } else {
                    skippedCount++;
                }
            }

            // Se não adicionou nenhum filme novo
            if (addedCount === 0 && skippedCount > 0) {
                alert('Todos os filmes da lista já estão na roleta!');
                return;
            }

            // Mensagem de feedback
            let message = `✨ ${addedCount} filme(s) adicionado(s) com sucesso!`;
            if (skippedCount > 0) {
                message += `\n\n${skippedCount} filme(s) foram ignorados (já existentes ou limite de 12 atingido).`;
            }
            alert(message);

            saveFilmes();
            updateMoviesList();
            updateRoulette();
            movieTextarea.value = '';
            
            // Efeito visual
            createSparkles(15);
        }

        function removeFilme(index) {
            filmes.splice(index, 1);
            saveFilmes();
            updateMoviesList();
            updateRoulette();
        }

        function updateMoviesList() {
            moviesList.innerHTML = '';

            if (filmes.length === 0) {
                const emptyMsg = document.createElement('div');
                emptyMsg.className = 'empty-message';
                emptyMsg.textContent = '✨ Nenhum filme adicionado ainda. Comece a adicionar!';
                moviesList.appendChild(emptyMsg);
                return;
            }

            filmes.forEach((filme, index) => {
                const movieItem = document.createElement('div');
                movieItem.className = 'movie-item';

                const textSpan = document.createElement('span');
                textSpan.className = 'movie-item-text';
                textSpan.textContent = `${index + 1}. ${filme}`;

                const deleteBtn = document.createElement('button');
                deleteBtn.className = 'delete-movie-btn';
                deleteBtn.textContent = '✕';
                deleteBtn.addEventListener('click', () => removeFilme(index));

                movieItem.appendChild(textSpan);
                movieItem.appendChild(deleteBtn);
                moviesList.appendChild(movieItem);
            });
        }

        function clearAllMovies() {
            if (filmes.length === 0) return;
            
            if (confirm('Tem certeza que deseja limpar todos os filmes da lista?')) {
                filmes = [];
                saveFilmes();
                updateMoviesList();
                updateRoulette();
                createSparkles(10);
            }
        }

        function updateRoulette() {
            if (filmes.length === 0) {
                spinButton.disabled = true;
                spinButton.textContent = '❌ Adicione filmes!';
                roulette.innerHTML = '';
                return;
            }

            spinButton.disabled = false;
            spinButton.textContent = '✨ GIRAR ✨';
            initRoulette();
        }

        /* =============================================
           EVENT LISTENERS - Gerenciar Filmes
           ============================================= */

        processListBtn.addEventListener('click', () => {
            processMovieList(movieTextarea.value);
        });

        // Permitir Ctrl+Enter para processar a lista
        movieTextarea.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && e.ctrlKey) {
                e.preventDefault();
                processMovieList(movieTextarea.value);
            }
        });

        clearAllBtn.addEventListener('click', clearAllMovies);

        toggleManageBtn.addEventListener('click', () => {
            manageMoviesSection.classList.toggle('collapsed');
            toggleManageBtn.textContent = manageMoviesSection.classList.contains('collapsed') 
                ? '▲ Abrir' 
                : '▼ Fechar';
        });

        /* =============================================
           CÁLCULO DE SLICES
           ============================================= */

        function getSliceDegrees() {
            return 360 / filmes.length;
        }

        /* =============================================
           INICIALIZAÇÃO - Criar Slices da Roleta
           ============================================= */

        function initRoulette() {
            roulette.innerHTML = '';
            
            filmes.forEach((filme, index) => {
                const slice = document.createElement('div');
                slice.className = 'slice';
                slice.textContent = filme;
                slice.style.transform = `rotate(${index * getSliceDegrees()}deg)`;
                
                // Alinhar texto corretamente
                const textRotation = (index + 0.5) * getSliceDegrees();
                slice.style.fontSize = 'clamp(0.65rem, 1.5vw, 0.95rem)';
                
                roulette.appendChild(slice);
            });
        }

        /* =============================================
           LÓGICA DE GIRAR - Física Realista
           ============================================= */

        function spinRoulette() {
            if (isSpinning || filmes.length === 0) return;

            isSpinning = true;
            spinButton.disabled = true;

            // Som de clique (usando Web Audio API)
            playClickSound();

            // Número de rotações (aumenta a velocidade percebida)
            const rotations = 5 + Math.random() * 3;
            const randomSlice = Math.floor(Math.random() * filmes.length);
            const sliceDegrees = getSliceDegrees();
            const targetRotation = rotations * 360 + (randomSlice * sliceDegrees) + (sliceDegrees / 2);

            // Easing com desaceleração natural (cubic-ease-out)
            animateSpin(targetRotation, 0, 4000);
        }

        function animateSpin(targetRotation, startTime, duration) {
            const currentTime = performance.now() - startTime;
            const progress = Math.min(currentTime / duration, 1);

            // Easing cúbico suave
            const easeProgress = 1 - Math.pow(1 - progress, 3);
            
            currentRotation = easeProgress * targetRotation;
            roulette.style.transform = `rotate(${currentRotation}deg)`;

            if (progress < 1) {
                requestAnimationFrame(() => animateSpin(targetRotation, startTime, duration));
            } else {
                onSpinComplete(targetRotation);
            }
        }

        function animateSpin(targetRotation, startTime, duration) {
            const now = performance.now();
            const currentTime = now - startTime;
            const progress = Math.min(currentTime / duration, 1);

            // Easing cúbico (desaceleração suave)
            const easeProgress = 1 - Math.pow(1 - progress, 3);
            
            currentRotation = easeProgress * targetRotation;
            roulette.style.transform = `rotate(${currentRotation}deg)`;

            if (progress < 1) {
                requestAnimationFrame(() => animateSpin(targetRotation, startTime, duration));
            } else {
                onSpinComplete(targetRotation);
            }
        }

        function onSpinComplete(finalRotation) {
            // Encontrar qual filme foi sorteado
            const normalizedRotation = ((360 - (finalRotation % 360)) % 360);
            const selectedIndex = Math.floor(normalizedRotation / getSliceDegrees()) % filmes.length;
            const selectedMovie = filmes[selectedIndex];

            // Mostrar resultado com animação
            showResult(selectedMovie);

            // Criar efeito de confete
            createConfetti();

            // Criar sparkles
            createSparkles(50);

            // Reset
            isSpinning = false;
            spinButton.disabled = false;
        }

        /* =============================================
           RESULTADO - Modal e Animações
           ============================================= */

        function showResult(movie) {
            movieName.textContent = `🎬 ${movie}`;
            resultOverlay.classList.add('active');

            // Som de vitória (opcional)
            playWinSound();
        }

        closeResult.addEventListener('click', () => {
            resultOverlay.classList.remove('active');
        });

        resultOverlay.addEventListener('click', (e) => {
            if (e.target === resultOverlay) {
                resultOverlay.classList.remove('active');
            }
        });

        /* =============================================
           EFEITOS VISUAIS - Confete e Sparkles
           ============================================= */

        function createConfetti() {
            const colors = ['#FF69B4', '#DA70D6', '#FFB6D9', '#E6B5F0'];
            
            for (let i = 0; i < 30; i++) {
                const confetti = document.createElement('div');
                confetti.innerHTML = ['✨', '💖', '⭐', '💫'][Math.floor(Math.random() * 4)];
                confetti.style.position = 'fixed';
                confetti.style.left = Math.random() * window.innerWidth + 'px';
                confetti.style.top = '0px';
                confetti.style.fontSize = Math.random() * 20 + 15 + 'px';
                confetti.style.opacity = '1';
                confetti.style.pointerEvents = 'none';
                confetti.style.zIndex = '101';
                confetti.style.color = colors[Math.floor(Math.random() * colors.length)];
                
                document.body.appendChild(confetti);

                // Animação
                const duration = Math.random() * 2 + 2;
                let posY = 0;
                let posX = 0;
                let velocityX = (Math.random() - 0.5) * 6;
                let velocityY = Math.random() * 4 + 2;

                const animate = () => {
                    posY += velocityY;
                    posX += velocityX;
                    velocityY += 0.1; // gravidade

                    confetti.style.transform = `translate(${posX}px, ${posY}px) rotate(${Math.random() * 360}deg)`;
                    confetti.style.opacity = 1 - (posY / window.innerHeight);

                    if (posY < window.innerHeight) {
                        requestAnimationFrame(animate);
                    } else {
                        confetti.remove();
                    }
                };

                animate();
            }
        }

        function createSparkles(count = 30) {
            for (let i = 0; i < count; i++) {
                const sparkle = document.createElement('div');
                sparkle.innerHTML = '✨';
                sparkle.style.position = 'fixed';
                sparkle.style.left = Math.random() * window.innerWidth + 'px';
                sparkle.style.top = Math.random() * window.innerHeight + 'px';
                sparkle.style.fontSize = Math.random() * 15 + 10 + 'px';
                sparkle.style.opacity = '1';
                sparkle.style.pointerEvents = 'none';
                sparkle.style.zIndex = '99';
                sparkle.style.animation = `sparkle 1s ease-out forwards`;

                document.body.appendChild(sparkle);

                setTimeout(() => sparkle.remove(), 1000);
            }
        }

        /* =============================================
           SOM - Clique e Vitória
           ============================================= */

        function playClickSound() {
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();

            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);

            oscillator.frequency.value = 800;
            oscillator.type = 'sine';

            gainNode.gain.setValueAtTime(0.1, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.1);

            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + 0.1);
        }

        function playWinSound() {
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const notes = [523, 659, 784]; // Do, Mi, Sol

            notes.forEach((freq, index) => {
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();

                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);

                oscillator.frequency.value = freq;
                oscillator.type = 'sine';

                const startTime = audioContext.currentTime + index * 0.1;
                gainNode.gain.setValueAtTime(0.1, startTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, startTime + 0.3);

                oscillator.start(startTime);
                oscillator.stop(startTime + 0.3);
            });
        }

        /* =============================================
           FUNDO ANIMADO - Geração de Partículas
           ============================================= */

        function createStars() {
            for (let i = 0; i < 50; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.animationDelay = Math.random() * 3 + 's';
                starsContainer.appendChild(star);
            }

            // Sparkles
            for (let i = 0; i < 30; i++) {
                const sparkle = document.createElement('div');
                sparkle.className = 'sparkle-bg';
                sparkle.style.left = Math.random() * 100 + '%';
                sparkle.style.top = Math.random() * 100 + '%';
                sparkle.style.animationDelay = Math.random() * 2 + 's';
                starsContainer.appendChild(sparkle);
            }

            // Corações flutuantes
            for (let i = 0; i < 8; i++) {
                const heart = document.createElement('div');
                heart.className = 'heart-bg';
                heart.textContent = '💖';
                heart.style.left = Math.random() * 100 + '%';
                heart.style.animationDelay = Math.random() * 15 + 's';
                starsContainer.appendChild(heart);
            }

            // Borboletas
            for (let i = 0; i < 5; i++) {
                const butterfly = document.createElement('div');
                butterfly.className = 'butterfly-bg';
                butterfly.textContent = '🦋';
                butterfly.style.left = Math.random() * 100 + '%';
                butterfly.style.top = Math.random() * 50 + '%';
                butterfly.style.animationDelay = Math.random() * 8 + 's';
                starsContainer.appendChild(butterfly);
            }
        }

        /* =============================================
           EVENT LISTENERS
           ============================================= */

        spinButton.addEventListener('click', spinRoulette);

        /* =============================================
           INICIALIZAÇÃO
           ============================================= */

        window.addEventListener('load', () => {
            loadFilmes();
            updateMoviesList();
            updateRoulette();
            createStars();
        });

        // Recrear sparkles aleatoriamente
        setInterval(() => {
            if (!isSpinning && Math.random() > 0.7) {
                createSparkles(3);
            }
        }, 2000);
    </script>

</body>
</html>
